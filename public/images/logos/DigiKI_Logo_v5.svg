<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" width="480" height="220">
  <defs>
    <linearGradient id="pill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#35C4BA"/>
      <stop offset="100%" style="stop-color:#28B5AB"/>
    </linearGradient>
  </defs>
  <rect width="480" height="220" fill="#FFFFFF"/>

  <!-- Pill behind KI: centered on KI visual center (y=106) -->
  <rect x="215" y="58" width="148" height="96" rx="48" fill="url(#pill)"/>

  <!-- D at baseline 140 -->
  <text x="20" y="140" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="95" fill="#1E293B">D</text>

  <!-- first i stroke: x-height to baseline -->
  <rect x="95" y="88" width="20" height="48" rx="2" fill="#1E293B"/>
  <!-- WLAN i-dot -->
  <circle cx="105" cy="70" r="2.5" fill="#35C4BA"/>
  <path d="M97,62 A11,11 0 0,1 113,62" fill="none" stroke="#35C4BA" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M93,55 A17,17 0 0,1 117,55" fill="none" stroke="#35C4BA" stroke-width="2.5" stroke-linecap="round"/>

  <!-- g at baseline 140 -->
  <text x="118" y="140" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="95" fill="#1E293B">g</text>

  <!-- second i stroke -->
  <rect x="183" y="88" width="20" height="48" rx="2" fill="#1E293B"/>
  <!-- Chip i-dot -->
  <rect x="181" y="54" width="24" height="24" rx="3.5" fill="#35C4BA"/>
  <rect x="186" y="59" width="14" height="14" rx="1.5" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.55"/>
  <line x1="188" y1="54" x2="188" y2="49" stroke="#35C4BA" stroke-width="2" stroke-linecap="round"/>
  <line x1="198" y1="54" x2="198" y2="49" stroke="#35C4BA" stroke-width="2" stroke-linecap="round"/>
  <line x1="188" y1="78" x2="188" y2="83" stroke="#35C4BA" stroke-width="2" stroke-linecap="round"/>
  <line x1="198" y1="78" x2="198" y2="83" stroke="#35C4BA" stroke-width="2" stroke-linecap="round"/>
  <line x1="181" y1="61" x2="176" y2="61" stroke="#35C4BA" stroke-width="2" stroke-linecap="round"/>
  <line x1="181" y1="71" x2="176" y2="71" stroke="#35C4BA" stroke-width="2" stroke-linecap="round"/>
  <line x1="205" y1="61" x2="210" y2="61" stroke="#35C4BA" stroke-width="2" stroke-linecap="round"/>
  <line x1="205" y1="71" x2="210" y2="71" stroke="#35C4BA" stroke-width="2" stroke-linecap="round"/>

  <!-- KI at SAME baseline 140 as D and g -->
  <text x="289" y="140" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="95" fill="#FFFFFF" letter-spacing="-2" text-anchor="middle">KI</text>

  <!-- OSNABRÜCK centered under KI pill -->
  <text x="289" y="192" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="26" fill="#E8921A" text-anchor="middle" letter-spacing="6">OSNABRÜCK</text>
</svg>