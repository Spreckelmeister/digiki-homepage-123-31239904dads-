// Neuer, richer Bridge mit Vorlagen-Auswahl, editierbaren Platzhaltern,
// Termin-Verknüpfung und Live-Vorschau.
function openCoworkBridge(termin = null, vorgewähltTpl = null) {
  // Liste der passenden Templates: bei vorhandenem Termin die mit passender Kategorie zuerst
  const sortedTpls = [...COWORK_TEMPLATES].sort((a, b) => {
    if (!termin) return 0;
    const aM = (a.kategorien || []).includes(termin.kategorie) ? 0 : 1;
    const bM = (b.kategorien || []).includes(termin.kategorie) ? 0 : 1;
    return aM - bM;
  });

  const modal = createModal(`
    <h2>Cowork-Anweisung erstellen</h2>
    <p class="muted">Wählen Sie eine Vorlage, prüfen Sie die Platzhalter und kopieren Sie die fertige Anweisung.</p>

    <div class="field">
      <label>Optional: mit Termin verknüpfen</label>
      <select id="cwTermin">
        <option value="">— kein Termin —</option>
        ${State.termineData ? State.termineData.termine
          .slice()
          .sort((a,b) => a.datum.localeCompare(b.datum))
          .map(t => `<option value="${t.id}">${formatDateDE(t.datum)} — ${escapeHtml(t.titel)}</option>`).join('') : ''}
      </select>
    </div>

    <div class="cowork-template-tabs" id="cwTpls">
      ${sortedTpls.map((t, i) => `<button data-idx="${i}">${t.icon} ${escapeHtml(t.titel)}</button>`).join('')}
    </div>

    <div id="cwBody"></div>

    <div class="actions">
      <button class="ghost" data-close>Schließen</button>
      <button class="primary" id="btnCopyCw">Anweisung kopieren</button>
    </div>
  `, 'large');

  let currentTpl = vorgewähltTpl || sortedTpls[0];
  let currentTermin = termin;
  const placeholderValues = {};

  const tplTabs = modal.querySelector('#cwTpls');
  function highlightTab() {
    tplTabs.querySelectorAll('button').forEach((btn, i) => {
      btn.classList.toggle('active', sortedTpls[i].id === currentTpl.id);
    });
  }
  tplTabs.querySelectorAll('button').forEach(btn => btn.addEventListener('click', () => {
    currentTpl = sortedTpls[parseInt(btn.dataset.idx)];
    Object.keys(placeholderValues).forEach(k => delete placeholderValues[k]);
    renderBody();
  }));

  modal.querySelector('#cwTermin').addEventListener('change', (e) => {
    const id = e.target.value;
    currentTermin = id ? State.termineData.termine.find(t => t.id === id) : null;
    Object.keys(placeholderValues).forEach(k => delete placeholderValues[k]);
    renderBody();
  });

  if (termin) modal.querySelector('#cwTermin').value = termin.id;

  function autoFillPlaceholders(tpl, t) {
    // Bringt bekannte Termin-Felder auf Standard-Platzhalter
    const map = {
      '{TITEL}': t?.titel,
      '{DATUM}': t?.datum ? formatDateDE(t.datum) : '',
      '{UHRZEIT}': t?.uhrzeit || '',
      '{ORT}': t?.ort || '',
      '{ZIELGRUPPE}': t?.zielgruppe || '',
      '{ORDNER}': t?.ordner || (t ? folderNameForTermin(t) : '[Ordner nach Termin-Anlage]'),
      '{SCHULE}': State.termineData?.schule?.name || State.dirName || '[Ihre Schule]',
    };
    return { ...map };
  }

  function renderBody() {
    highlightTab();
    const body = modal.querySelector('#cwBody');
    const auto = autoFillPlaceholders(currentTpl, currentTermin);
    const platzhalter = currentTpl.platzhalter || [];
    const fieldsHtml = platzhalter.map(p => {
      const prefill = placeholderValues[p] ?? auto[p] ?? '';
      return `
        <div class="field">
          <label>${escapeHtml(p)}</label>
          <input type="text" class="cw-ph" data-ph="${escapeHtml(p)}" value="${escapeHtml(prefill)}" />
        </div>`;
    }).join('');

    body.innerHTML = `
      <p class="muted" style="margin-top:.5em"><strong>${currentTpl.icon} ${escapeHtml(currentTpl.titel)}</strong> — ${escapeHtml(currentTpl.beschreibung)}</p>
      ${fieldsHtml ? '<div class="placeholder-form">' + fieldsHtml + '</div>' : ''}
      <label style="margin-top:.8em">Vorschau der Anweisung</label>
      <div class="cowork-preview" id="cwPreview"></div>
    `;
    body.querySelectorAll('.cw-ph').forEach(inp => {
      inp.addEventListener('input', () => {
        placeholderValues[inp.dataset.ph] = inp.value;
        renderPreview();
      });
    });
    renderPreview();
  }

  function renderPreview() {
    const auto = autoFillPlaceholders(currentTpl, currentTermin);
    const all = { ...auto, ...placeholderValues };
    let out = currentTpl.template;
    Object.keys(all).forEach(k => {
      out = out.split(k).join(all[k] || k);
    });
    // Kontext ergänzen
    if (currentTermin) {
      out = `Kontext: Termin "${currentTermin.titel}" am ${formatDateDE(currentTermin.datum)}${currentTermin.uhrzeit ? ' um ' + currentTermin.uhrzeit : ''}${currentTermin.ort ? ' in ' + currentTermin.ort : ''}.\nSchulordner: ${State.dirName || '[Schulordner]'}\n\n` + out;
    }
    if (State.settings.vertretungsmodus) {
      out += `\n\nHinweis an Cowork: Die Schulleitung ist abwesend, Rückfragen bitte an ${State.settings.vertretungsname || '[Name]'}.`;
    }
    modal.querySelector('#cwPreview').textContent = out;
  }

  modal.querySelector('#btnCopyCw').addEventListener('click', () => {
    const text = modal.querySelector('#cwPreview').textContent;
    copyToClipboard(text);
    closeModal();
  });

  renderBody();
}

function openPflichttermineModal() {
  const rows = PFLICHTTERMINE_NI.map((p, i) => {
    const berechnet = berechneDatum(p.regel, State.ferienData, new Date().getFullYear());
    return `
      <tr>
        <td><input type="checkbox" data-idx="${i}" /></td>
        <td>${escapeHtml(p.titel)}</td>
        <td>${regelAlsText(p.regel)}</td>
        <td>${berechnet ? formatDateDE(berechnet) : '—'}</td>
      </tr>`;
  }).join('');
  const modal = createModal(`
    <h2>Pflichttermine Niedersachsen</h2>
    <p class="muted">Wählen Sie aus, welche Termine für Ihre Schule relevant sind. Die Berechnung nutzt die aktuellen Ferien-Daten.</p>
    <div style="max-height:50vh;overflow-y:auto">
      <table>
        <thead><tr><th></th><th>Titel</th><th>Regel</th><th>Berechnetes Datum</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <div class="actions">
      <button class="ghost" data-close>Abbrechen</button>
      <button class="primary" id="btnAdd">Ausgewählte übernehmen</button>
    </div>
  `, 'large');
  modal.querySelector('#btnAdd').addEventListener('click', async () => {
    const selected = Array.from(modal.querySelectorAll('input[type=checkbox]:checked')).map(cb => PFLICHTTERMINE_NI[parseInt(cb.dataset.idx)]);
    for (const p of selected) {
      const berechnet = berechneDatum(p.regel, State.ferienData, new Date().getFullYear());
      if (!berechnet) continue;
      await addTermin({
        titel: p.titel,
        beschreibung: p.beschreibung,
        kategorie: p.kategorie,
        regel: p.regel,
        datum: berechnet,
        zielgruppe: '',
        ordner_anlegen: false,
      });
    }
    closeModal();
    toast(`${selected.length} Pflichttermine übernommen`);
    render();
  });
}

// ---- Modal-Helper ----
function createModal(innerHtml, cls = '') {
  closeModal();
  const root = document.getElementById('modalRoot');
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = `<div class="modal ${cls}"><button class="close" data-close aria-label="Schließen">×</button>${innerHtml}</div>`;
  root.appendChild(backdrop);
  State.activeModal = backdrop;
  backdrop.addEventListener('click', (e) => { if (e.target === backdrop) closeModal(); });
  backdrop.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeModal));
  document.addEventListener('keydown', escClose);
  return backdrop.querySelector('.modal');
}
function closeModal() {
  if (State.activeModal) { State.activeModal.remove(); State.activeModal = null; }
  document.removeEventListener('keydown', escClose);
}
function escClose(e) { if (e.key === 'Escape') closeModal(); }

// ============================================================================
// SUCHE
// ============================================================================
function setupSuche() {
  const input = document.getElementById('searchInput');
  const resultsEl = document.getElementById('searchResults');
  input.addEventListener('input', () => {
    const q = input.value.trim().toLowerCase();
    if (!q || !State.termineData) { resultsEl.classList.add('hidden'); return; }
    const hits = State.termineData.termine.filter(t =>
      (t.titel||'').toLowerCase().includes(q) ||
      (t.beschreibung||'').toLowerCase().includes(q) ||
      (t.zielgruppe||'').toLowerCase().includes(q) ||
      (t.ordner||'').toLowerCase().includes(q)
    ).slice(0, 10);
    if (hits.length === 0) {
      resultsEl.innerHTML = '<div class="result muted">Keine Treffer.</div>';
    } else {
      resultsEl.innerHTML = hits.map(t => `
        <div class="result" data-id="${t.id}">
          <div><strong>${escapeHtml(t.titel)}</strong></div>
          <div class="meta">${formatDateDE(t.datum)}${t.ordner?' · '+escapeHtml(t.ordner):''}</div>
        </div>`).join('');
      resultsEl.querySelectorAll('.result[data-id]').forEach(r => r.addEventListener('click', () => {
        openTerminDetails(r.dataset.id);
        input.value = ''; resultsEl.classList.add('hidden');
      }));
    }
    resultsEl.classList.remove('hidden');
  });
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.search')) resultsEl.classList.add('hidden');
  });
}

// ============================================================================
// COMMAND PALETTE (Strg+K)
// ============================================================================
// Zentraler Einstieg für alle Funktionen. Auch: "Schnell-Hinzufügen" — wenn
// der eingegebene Text nach einem Termin aussieht, bietet die Palette direkt
// das Anlegen an.

function openCommandPalette() {
  closeModal();
  const root = document.getElementById('modalRoot');
  const backdrop = document.createElement('div');
  backdrop.className = 'cmd-backdrop';
  backdrop.innerHTML = `
    <div class="cmd-box" role="dialog" aria-label="Befehle">
      <div class="cmd-input-wrap">
        <input type="text" id="cmdInput" class="cmd-input" placeholder="Suchen oder Befehl eingeben (z.B. „Elternabend 15.9. 19:30")…" autocomplete="off" />
      </div>
      <div class="cmd-results" id="cmdResults"></div>
      <div class="cmd-footer">
        <span><kbd>↑↓</kbd> Navigieren · <kbd>↵</kbd> Ausführen · <kbd>Esc</kbd> Schließen</span>
        <span>Strg+K überall öffnen</span>
      </div>
    </div>`;
  root.appendChild(backdrop);
  State.activeModal = backdrop;
  backdrop.addEventListener('click', (e) => { if (e.target === backdrop) closeModal(); });

  const input = backdrop.querySelector('#cmdInput');
  const results = backdrop.querySelector('#cmdResults');
  let cursor = 0;
  let entries = [];

  function commandList(q) {
    const out = [];
    const quickAdd = parseQuickAdd(q);
    if (q && quickAdd && quickAdd.datum && quickAdd.titel) {
      out.push({
        label: `Termin anlegen: „${quickAdd.titel}" am ${formatDateDE(quickAdd.datum)}${quickAdd.uhrzeit ? ' um ' + quickAdd.uhrzeit : ''}`,
        sub: 'Schnellanlage aus Ihrer Eingabe',
        icon: '➕',
        group: 'Schnellaktion',
        action: async () => {
          await addTermin({ titel: quickAdd.titel, datum: quickAdd.datum, uhrzeit: quickAdd.uhrzeit || null, ordner_anlegen: false });
          toast(`„${quickAdd.titel}" angelegt`);
          render();
        }
      });
    }

    const nav = [
      { label: 'Kalender öffnen', icon: '📅', tab: 'kalender', shortcut: '1' },
      { label: 'Terminliste öffnen', icon: '📝', tab: 'termine', shortcut: '2' },
      { label: 'Importieren öffnen', icon: '📥', tab: 'importieren', shortcut: '3' },
      { label: 'Cowork-Vorlagen öffnen', icon: '✨', tab: 'cowork', shortcut: '4' },
      { label: 'Jahreswechsel öffnen', icon: '🔄', tab: 'jahreswechsel', shortcut: '5' },
      { label: 'Vorlagen öffnen', icon: '📄', tab: 'vorlagen', shortcut: '6' },
      { label: 'Zeitstrahl öffnen', icon: '📊', tab: 'zeitstrahl', shortcut: '7' },
      { label: 'Einstellungen öffnen', icon: '⚙️', tab: 'einstellungen', shortcut: '8' },
    ];
    nav.forEach(n => out.push({ ...n, group: 'Navigation', action: () => { State.currentTab = n.tab; document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === n.tab)); render(); } }));

    out.push({
      label: 'Neuen Termin anlegen…',
      icon: '➕',
      group: 'Aktionen',
      shortcut: 'N',
      action: () => openTerminModal(),
    });
    out.push({
      label: 'Zum heutigen Tag springen',
      icon: '📍',
      group: 'Aktionen',
      shortcut: 'T',
      action: () => { State.currentMonth = new Date(); State.currentTab = 'kalender'; State.currentView = 'monat'; render(); },
    });
    out.push({
      label: 'Dunkelmodus umschalten',
      icon: '🌓',
      group: 'Aktionen',
      action: async () => {
        State.settings.theme = State.settings.theme === 'dark' ? 'light' : 'dark';
        applySettings(); await saveSettings();
      },
    });
    out.push({
      label: 'Kalender als iCal exportieren',
      icon: '📤',
      group: 'Aktionen',
      action: exportIcal,
    });
    out.push({
      label: 'Schulordner trennen',
      icon: '🔌',
      group: 'Aktionen',
      action: async () => {
        if (!confirm('Verbindung zum Schulordner trennen?')) return;
        await idbSet('dirHandle', null);
        State.dirHandle = null; State.dirName = null; State.termineData = null;
        render();
      }
    });

    // Cowork-Vorlagen
    COWORK_TEMPLATES.forEach(t => {
      out.push({
        label: `Cowork: ${t.titel}`,
        sub: t.beschreibung,
        icon: t.icon,
        group: 'Cowork-Vorlage',
        action: () => openCoworkBridge(null, t),
      });
    });

    // Termine
    if (State.termineData && q && q.length >= 2) {
      const lowQ = q.toLowerCase();
      State.termineData.termine
        .filter(t => (t.titel||'').toLowerCase().includes(lowQ) || (t.ordner||'').toLowerCase().includes(lowQ))
        .slice(0, 6)
        .forEach(t => out.push({
          label: t.titel,
          sub: `${formatDateDE(t.datum)}${t.ordner ? ' · ' + t.ordner : ''}`,
          icon: '🔎',
          group: 'Termine',
          action: () => openTerminDetails(t.id),
        }));
    }

    if (!q) return out;
    const lowQ = q.toLowerCase();
    return out.filter(e =>
      e.label.toLowerCase().includes(lowQ) ||
      (e.sub || '').toLowerCase().includes(lowQ) ||
      e.group.toLowerCase().includes(lowQ)
    );
  }

  function renderResults() {
    entries = commandList(input.value.trim());
    if (cursor >= entries.length) cursor = Math.max(0, entries.length - 1);
    let lastGroup = '';
    results.innerHTML = entries.map((e, i) => {
      const groupHeader = e.group !== lastGroup ? `<div class="cmd-group-label">${escapeHtml(e.group)}</div>` : '';
      lastGroup = e.group;
      return groupHeader + `
        <div class="cmd-item ${i === cursor ? 'active' : ''}" data-i="${i}">
          <div class="cmd-icon">${e.icon || '•'}</div>
          <div class="cmd-label">
            <div>${escapeHtml(e.label)}</div>
            ${e.sub ? `<div class="cmd-sub">${escapeHtml(e.sub)}</div>` : ''}
          </div>
          ${e.shortcut ? `<span class="cmd-shortcut">${e.shortcut}</span>` : ''}
        </div>`;
    }).join('') || '<div class="cmd-item muted" style="padding:1em 1.2em;color:var(--text-muted)">Keine Treffer.</div>';

    results.querySelectorAll('.cmd-item[data-i]').forEach(el => {
      el.addEventListener('click', () => execute(parseInt(el.dataset.i)));
      el.addEventListener('mouseenter', () => { cursor = parseInt(el.dataset.i); highlightCursor(); });
    });
  }

  function highlightCursor() {
    results.querySelectorAll('.cmd-item').forEach((el, i) => {
      el.classList.toggle('active', i === cursor);
    });
    // in den sichtbaren Bereich scrollen
    const active = results.querySelector('.cmd-item.active');
    if (active) active.scrollIntoView({ block: 'nearest' });
  }

  function execute(i) {
    const e = entries[i];
    if (!e || !e.action) return;
    closeModal();
    setTimeout(() => e.action(), 0);
  }

  input.addEventListener('input', () => { cursor = 0; renderResults(); });
  backdrop.addEventListener('keydown', (ev) => {
    if (ev.key === 'ArrowDown') { ev.preventDefault(); cursor = Math.min(entries.length - 1, cursor + 1); highlightCursor(); }
    else if (ev.key === 'ArrowUp') { ev.preventDefault(); cursor = Math.max(0, cursor - 1); highlightCursor(); }
    else if (ev.key === 'Enter') { ev.preventDefault(); execute(cursor); }
    else if (ev.key === 'Escape') { closeModal(); }
  });

  renderResults();
  setTimeout(() => input.focus(), 10);
}

// ============================================================================
// KEYBOARD SHORTCUTS
// ============================================================================
function setupKeyboardShortcuts() {
  document.addEventListener('keydown', (e) => {
    const tag = (e.target.tagName || '').toLowerCase();
    const inField = tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable;
    // Strg+K / Cmd+K öffnet Palette — auch im Input
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      openCommandPalette();
      return;
    }
    if (inField) return;
    // Einzelne Tasten ohne Modifier
    if (e.key === '/') { e.preventDefault(); document.getElementById('searchInput').focus(); return; }
    if (e.key.toLowerCase() === 'n' && State.dirHandle) { e.preventDefault(); openTerminModal(); return; }
    if (e.key.toLowerCase() === 't') { State.currentMonth = new Date(); State.currentTab = 'kalender'; State.currentView = 'monat'; document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === 'kalender')); render(); return; }
    if (e.key.toLowerCase() === 'j' && State.currentTab === 'kalender') { State.currentView = 'jahr'; render(); return; }
    if (e.key.toLowerCase() === 'm' && State.currentTab === 'kalender') { State.currentView = 'monat'; render(); return; }
    if (e.key.toLowerCase() === 'l' && State.currentTab === 'kalender') { State.currentView = 'liste'; render(); return; }
    const tabs = ['kalender','termine','importieren','cowork','jahreswechsel','vorlagen','zeitstrahl','einstellungen'];
    if (/^[1-8]$/.test(e.key)) {
      const idx = parseInt(e.key) - 1;
      if (tabs[idx]) {
        State.currentTab = tabs[idx];
        document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === tabs[idx]));
        render();
      }
    }
  });
}

function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function getTermineAm(iso) {
  if (!State.termineData) return [];
  return State.termineData.termine.filter(t => t.datum === iso);
}

document.getElementById('nav').addEventListener('click', (e) => {

    document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('active', b === e.target));

document.getElementById('themeToggle').addEventListener('click', async () => {
  State.settings.theme = State.settings.theme === 'dark' ? 'light' : 'dark';

});

(async function init() {
  setupSuche();
  setupKeyboardShortcuts();
  const restored = await tryRestoreFolder();
  if (restored === 'needsPermission') {
    // Beim ersten Klick Berechtigung neu anfordern
    const banner = document.createElement('div');
    banner.className = 'banner info';
    banner.innerHTML = `Willkommen zurück. Bitte bestätigen Sie den Zugriff auf den Schulordner "<strong>${escapeHtml(State.dirName)}</strong>". <button class="primary mt-1" id="btnGrant">Zugriff bestätigen</button>`;
    document.getElementById('content').prepend(banner);
    document.getElementById('btnGrant').addEventListener('click', async () => {
      const ok = await ensurePermission(State.dirHandle);
      if (ok) { await loadAll(); render(); }
    });
  }
  render();
})();

// ============================================================================
// ENDE
//
// Bekannte Einschränkungen und nächste Schritte:
//
// 1. File System Access API wird in Firefox und Safari (noch) nicht unterstützt.
//    Die App zeigt einen Hinweis; für produktiven Einsatz empfohlen: Chrome, Edge, Brave.
//
// 2. Word-/PDF-Platzhalter: Aktuell werden nur Text-, Markdown-, HTML- und CSV-Dateien
//    auf Platzhalter im Format {NAME} analysiert. Für .docx müsste ein Parser
//    (z.B. mammoth.js) eingebunden werden.
//
// 3. Das automatische Umbenennen von Ordnern kopiert alle enthaltenen Dateien,
//    weil die File System Access API kein natives rename bietet. Bei großen
//    Ordnern kann das dauern. Ein Hinweis wäre nett.
//
// 4. iCal-Parser ist minimal (nur VEVENT mit DTSTART, SUMMARY, DESCRIPTION).
//    Wiederholungen (RRULE), Zeitzonen und Ausnahmen werden ignoriert. Für
//    die meisten kommunalen Kalender reicht das aus, für komplexere Feeds
//    sollte ical.js o.ä. eingebunden werden.
//
// 5. Reminder: derzeit nur in der Sidebar sichtbar. System-Notifications
//    (Notification API) könnten ergänzt werden, verlangen aber zusätzliche
//    Berechtigungen und laufen nur bei geöffnetem Tab.
//
// 6. Mehrere Schuljahre: aktuell wird nur ein Schuljahr aktiv geführt.
//    Als nächstes Feature könnte das termine.json-Schema um eine
//    Schuljahre-Liste erweitert und ein Switcher in die Topbar gesetzt werden.
//
// 7. Offline-Fähigkeit: OpenHolidays-Daten werden lokal gecacht. Die App
//    selbst läuft komplett offline, sofern sie einmal geladen wurde. Ein
//    Service Worker würde das Laden beschleunigen, ist aber nicht zwingend.
//
// 8. Barrierefreiheit: Grundlagen (Labels, Tastaturbedienung, ARIA-Labels,
//    Fokus-Ringe) sind vorhanden. Ein vollständiger Screenreader-Durchlauf
//    steht noch aus.
//
// 9. Die KI-Pflege-Hinweise (Nice-to-Have) sind bewusst schlicht gehalten —
//    die App weist nach dem Speichern nicht proaktiv auf "Soll das nächstes
//    Jahr wieder erscheinen?" hin. Das ließe sich nach dem addTermin()-Aufruf
//    mit einem dezenten Hinweis-Toast ergänzen.
//
// 10. Cowork-Bridge: Die Anweisungen werden in die Zwischenablage gelegt.
//    Eine noch engere Integration (z.B. Schreiben einer "cowork-aufgaben.md"
//    im Schulordner, die Cowork selbstständig abarbeitet) wäre naheliegend
//    und würde den Workflow weiter vereinfachen.
// ============================================================================
