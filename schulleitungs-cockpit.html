<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Schulleitungs-Cockpit</title>
<style>
  /* ============================================================
     Schulleitungs-Cockpit – Styles
     Ruhige, warme Palette. Viel Weißraum. System-Schrift.
     ============================================================ */

  :root {
    --bg: #f7f6f2;
    --surface: #ffffff;
    --surface-2: #fbfaf7;
    --border: #e5e2d9;
    --text: #1f2a2e;
    --text-muted: #6b7a80;
    --accent: #286b6b;          /* gedämpftes Petrol/Teal */
    --accent-soft: #e6f0ef;
    --accent-dark: #1c5050;
    --warn: #c98a2b;
    --warn-soft: #fcefd6;
    --danger: #b0463a;
    --danger-soft: #fbe3df;
    --ok: #2f7a4f;
    --ok-soft: #dff0e5;
    --holiday-bg: #eef0f2;      /* graue Ferien-Bänder */
    --feiertag: #b0463a;
    --shadow: 0 1px 2px rgba(20,30,30,.04), 0 4px 18px rgba(20,30,30,.06);
    --shadow-lg: 0 6px 24px rgba(20,30,30,.10);
    --radius: 10px;
    --radius-sm: 6px;

    /* Kategorien */
    --cat-eltern: #3d6fa8;
    --cat-konferenz: #7a4e9c;
    --cat-pflicht: #b0463a;
    --cat-unterricht: #2f7a4f;
    --cat-schulentw: #c87d2b;
    --cat-sonstiges: #6b7a80;
  }

  [data-theme="dark"] {
    --bg: #121819;
    --surface: #1a2224;
    --surface-2: #202a2c;
    --border: #2c3739;
    --text: #e8ece8;
    --text-muted: #9aa8ad;
    --accent: #4ea3a3;
    --accent-soft: #1e3636;
    --accent-dark: #6fc2c2;
    --warn-soft: #3a2e15;
    --danger-soft: #3a1e1a;
    --ok-soft: #173024;
    --holiday-bg: #242b2c;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 18px rgba(0,0,0,.25);
    --shadow-lg: 0 6px 24px rgba(0,0,0,.4);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  button, input, select, textarea {
    font-family: inherit;
    font-size: inherit;
    color: inherit;
  }

  button {
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--surface);
    padding: .55em 1em;
    border-radius: var(--radius-sm);
    transition: background .15s, border-color .15s, transform .05s;
  }
  button:hover { background: var(--accent-soft); border-color: var(--accent); }
  button:active { transform: translateY(1px); }
  button.primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  button.primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
  button.ghost { background: transparent; border-color: transparent; }
  button.ghost:hover { background: var(--accent-soft); }
  button.danger {
    background: var(--danger-soft);
    border-color: var(--danger);
    color: var(--danger);
  }
  button:disabled { opacity: .5; cursor: not-allowed; }

  input[type="text"], input[type="date"], input[type="time"], input[type="number"], input[type="url"],
  select, textarea {
    width: 100%;
    padding: .55em .7em;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface);
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  input:focus, select:focus, textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  label { display: block; font-weight: 500; margin-bottom: .3em; }
  .field { margin-bottom: 1em; }
  .field small { color: var(--text-muted); display: block; margin-top: .25em; }
  .row { display: flex; gap: .8em; }
  .row > * { flex: 1; }
  .checkbox-row { display: flex; align-items: center; gap: .5em; margin: .5em 0; }
  .checkbox-row input[type="checkbox"] { width: auto; margin: 0; }

  /* ==================== Layout ==================== */
  .app {
    display: grid;
    grid-template-rows: auto 1fr;
    min-height: 100vh;
  }

  .topbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: .7em 1.4em;
    display: flex;
    align-items: center;
    gap: 1.2em;
    flex-wrap: wrap;
  }
  .topbar .logo {
    font-weight: 600;
    font-size: 1.05em;
    color: var(--accent);
    letter-spacing: -0.01em;
  }
  .topbar nav {
    display: flex;
    gap: .2em;
    flex-wrap: wrap;
  }
  .topbar nav button {
    background: transparent;
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    padding: .45em .9em;
    color: var(--text-muted);
    font-weight: 500;
  }
  .topbar nav button.active {
    background: var(--accent-soft);
    color: var(--accent-dark);
  }
  .topbar nav button:hover { color: var(--accent-dark); }

  .topbar .spacer { flex: 1; }
  .topbar .folder-status {
    font-size: .85em;
    color: var(--text-muted);
    padding: .35em .7em;
    background: var(--surface-2);
    border-radius: var(--radius-sm);
    max-width: 280px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .topbar .folder-status.connected { color: var(--ok); background: var(--ok-soft); }
  .topbar .search {
    position: relative;
    min-width: 240px;
  }
  .topbar .search input {
    padding-left: 2em;
  }
  .topbar .search::before {
    content: "🔍";
    position: absolute;
    left: .6em;
    top: 50%;
    transform: translateY(-50%);
    font-size: .9em;
    opacity: .6;
  }
  .topbar .search-results {
    position: absolute;
    top: 110%;
    left: 0;
    right: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    max-height: 300px;
    overflow-y: auto;
    z-index: 100;
    box-shadow: var(--shadow-lg);
  }
  .topbar .search-results .result {
    padding: .55em .8em;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
  }
  .topbar .search-results .result:last-child { border-bottom: none; }
  .topbar .search-results .result:hover { background: var(--accent-soft); }
  .topbar .search-results .result .meta { font-size: .8em; color: var(--text-muted); }

  .main {
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 0;
    overflow: hidden;
  }
  .content {
    padding: 1.6em 2em;
    overflow-y: auto;
    max-height: calc(100vh - 58px);
  }
  .sidebar {
    border-left: 1px solid var(--border);
    background: var(--surface);
    padding: 1.4em 1.2em;
    overflow-y: auto;
    max-height: calc(100vh - 58px);
  }

  @media (max-width: 1100px) {
    .main { grid-template-columns: 1fr; }
    .sidebar { border-left: none; border-top: 1px solid var(--border); max-height: none; }
  }

  h1 { font-size: 1.6em; margin: 0 0 .3em; letter-spacing: -0.02em; }
  h2 { font-size: 1.2em; margin: 1.2em 0 .6em; letter-spacing: -0.01em; }
  h3 { font-size: 1.0em; margin: 1em 0 .4em; letter-spacing: -0.01em; }
  p.lead { color: var(--text-muted); margin-top: 0; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.2em 1.4em;
    margin-bottom: 1.1em;
    box-shadow: var(--shadow);
  }
  .card.soft { box-shadow: none; background: var(--surface-2); }

  /* ==================== Kalender – Jahresansicht ==================== */
  .year-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: .9em;
  }
  .month-mini {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: .7em .85em;
  }
  .month-mini h4 {
    margin: 0 0 .4em;
    font-size: .95em;
    color: var(--accent-dark);
  }
  .mini-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
    font-size: .72em;
  }
  .mini-grid .dow {
    color: var(--text-muted);
    text-align: center;
    font-weight: 500;
    padding: 2px 0;
  }
  .mini-grid .d {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
    position: relative;
    cursor: pointer;
    color: var(--text);
  }
  .mini-grid .d.other-month { color: var(--text-muted); opacity: .3; }
  .mini-grid .d.today { outline: 2px solid var(--accent); font-weight: 600; }
  .mini-grid .d.holiday { background: var(--holiday-bg); }
  .mini-grid .d.feiertag { color: var(--feiertag); font-weight: 600; }
  .mini-grid .d.has-termin::after {
    content: "";
    position: absolute;
    bottom: 2px;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--accent);
  }
  .mini-grid .d.has-termin.many::after {
    width: 6px;
    background: var(--warn);
  }

  /* ==================== Kalender – Monatsansicht ==================== */
  .month-nav {
    display: flex;
    align-items: center;
    gap: .6em;
    margin-bottom: .9em;
  }
  .month-nav h2 { margin: 0; }
  .month-full {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .month-full .dow-head {
    background: var(--surface-2);
    padding: .4em .6em;
    font-size: .82em;
    font-weight: 500;
    color: var(--text-muted);
    text-align: center;
  }
  .month-full .cell {
    background: var(--surface);
    min-height: 100px;
    padding: .35em .5em;
    font-size: .85em;
    position: relative;
    cursor: pointer;
  }
  .month-full .cell:hover { background: var(--surface-2); }
  .month-full .cell.other-month { background: var(--surface-2); color: var(--text-muted); }
  .month-full .cell.today .daynum { background: var(--accent); color: #fff; border-radius: 50%; width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center; font-weight: 600; }
  .month-full .cell.holiday { background: var(--holiday-bg); }
  .month-full .cell .daynum { font-weight: 500; display: inline-block; }
  .month-full .cell .feiertag-label {
    display: block;
    font-size: .7em;
    color: var(--feiertag);
    font-weight: 600;
    margin-top: 2px;
  }
  .month-full .termin-chip {
    background: var(--cat-sonstiges);
    color: #fff;
    font-size: .75em;
    padding: 2px 5px;
    border-radius: 3px;
    margin-top: 3px;
    display: block;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    cursor: grab;
  }
  .month-full .termin-chip.dragging { opacity: .4; }
  .month-full .termin-chip.external { opacity: .6; font-style: italic; }
  .month-full .cell.drag-over { outline: 2px dashed var(--accent); outline-offset: -2px; }
  .termin-chip[data-cat="elternkommunikation"] { background: var(--cat-eltern); }
  .termin-chip[data-cat="konferenzen"] { background: var(--cat-konferenz); }
  .termin-chip[data-cat="pflichttermine"] { background: var(--cat-pflicht); }
  .termin-chip[data-cat="unterricht"] { background: var(--cat-unterricht); }
  .termin-chip[data-cat="schulentwicklung"] { background: var(--cat-schulentw); }
  .termin-chip.conflict::before {
    content: "⚠ ";
  }

  /* ==================== Listenansicht ==================== */
  .list-group h3 {
    border-bottom: 1px solid var(--border);
    padding-bottom: .3em;
    margin-top: 1.5em;
  }
  .list-item {
    display: grid;
    grid-template-columns: 80px 1fr auto;
    gap: 1em;
    padding: .8em 0;
    border-bottom: 1px solid var(--border);
    align-items: center;
    cursor: pointer;
  }
  .list-item:hover { background: var(--surface-2); }
  .list-item .date {
    font-weight: 600;
    color: var(--accent-dark);
    text-align: center;
  }
  .list-item .date .day { font-size: 1.4em; line-height: 1; }
  .list-item .date .month { font-size: .75em; text-transform: uppercase; color: var(--text-muted); }
  .list-item .info .title { font-weight: 500; }
  .list-item .info .meta { font-size: .85em; color: var(--text-muted); }
  .list-item .cat-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--cat-sonstiges);
  }
  .cat-dot[data-cat="elternkommunikation"] { background: var(--cat-eltern); }
  .cat-dot[data-cat="konferenzen"] { background: var(--cat-konferenz); }
  .cat-dot[data-cat="pflichttermine"] { background: var(--cat-pflicht); }
  .cat-dot[data-cat="unterricht"] { background: var(--cat-unterricht); }
  .cat-dot[data-cat="schulentwicklung"] { background: var(--cat-schulentw); }

  /* ==================== Sidebar-Checkliste ==================== */
  .sidebar h3 {
    margin: 1em 0 .5em;
    font-size: .85em;
    text-transform: uppercase;
    letter-spacing: .05em;
    color: var(--text-muted);
  }
  .sidebar h3:first-child { margin-top: 0; }
  .checklist-item {
    display: flex;
    align-items: flex-start;
    gap: .6em;
    padding: .5em 0;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .checklist-item:last-child { border-bottom: none; }
  .checklist-item.done { opacity: .4; }
  .checklist-item.done .title { text-decoration: line-through; }
  .checklist-item input { margin-top: 3px; }
  .checklist-item .title { font-size: .92em; }
  .checklist-item .meta { font-size: .78em; color: var(--text-muted); }
  .checklist-item.overdue { background: var(--danger-soft); border-radius: 4px; padding: .5em; }

  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: .5em;
    margin-bottom: 1em;
  }
  .stat {
    background: var(--surface-2);
    border-radius: var(--radius-sm);
    padding: .6em .7em;
  }
  .stat .num { font-size: 1.4em; font-weight: 600; color: var(--accent); }
  .stat .lbl { font-size: .78em; color: var(--text-muted); }

  /* ==================== Modals ==================== */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(20,30,30,.4);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 3em 1em;
    z-index: 1000;
    overflow-y: auto;
  }
  .modal {
    background: var(--surface);
    border-radius: var(--radius);
    max-width: 600px;
    width: 100%;
    padding: 1.6em 1.8em;
    box-shadow: var(--shadow-lg);
    position: relative;
  }
  .modal.large { max-width: 900px; }
  .modal h2 { margin-top: 0; }
  .modal .close {
    position: absolute;
    top: .8em;
    right: .8em;
    border: none;
    background: transparent;
    font-size: 1.5em;
    line-height: 1;
    color: var(--text-muted);
    padding: .3em .5em;
  }
  .modal .actions {
    margin-top: 1.4em;
    display: flex;
    justify-content: flex-end;
    gap: .6em;
  }

  /* ==================== Plus-Button (FAB) ==================== */
  .fab {
    position: fixed;
    bottom: 1.5em;
    right: 1.5em;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    border: none;
    font-size: 1.6em;
    box-shadow: var(--shadow-lg);
    z-index: 50;
  }
  .fab:hover { background: var(--accent-dark); border: none; }

  /* ==================== Banner / Toast ==================== */
  .banner {
    background: var(--warn-soft);
    border-left: 4px solid var(--warn);
    padding: .8em 1em;
    border-radius: var(--radius-sm);
    margin-bottom: 1em;
  }
  .banner.info { background: var(--accent-soft); border-left-color: var(--accent); }
  .banner.error { background: var(--danger-soft); border-left-color: var(--danger); }
  .banner.ok { background: var(--ok-soft); border-left-color: var(--ok); }
  .vertretung-banner {
    background: var(--warn-soft);
    border-bottom: 2px solid var(--warn);
    padding: .5em 1em;
    font-size: .9em;
    text-align: center;
  }

  .toast {
    position: fixed;
    bottom: 1em;
    left: 50%;
    transform: translateX(-50%);
    background: var(--text);
    color: var(--bg);
    padding: .7em 1.2em;
    border-radius: var(--radius-sm);
    box-shadow: var(--shadow-lg);
    z-index: 2000;
    animation: slide-up .2s;
  }
  @keyframes slide-up {
    from { opacity: 0; transform: translate(-50%, 10px); }
    to { opacity: 1; transform: translate(-50%, 0); }
  }

  /* ==================== Tabellen ==================== */
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: .55em .7em; text-align: left; border-bottom: 1px solid var(--border); }
  th { font-weight: 500; color: var(--text-muted); font-size: .85em; background: var(--surface-2); }
  tr:hover td { background: var(--surface-2); }

  /* ==================== Tags / Badges ==================== */
  .tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: .78em;
    background: var(--surface-2);
    color: var(--text-muted);
  }
  .tag.ok { background: var(--ok-soft); color: var(--ok); }
  .tag.warn { background: var(--warn-soft); color: var(--warn); }
  .tag.danger { background: var(--danger-soft); color: var(--danger); }

  /* ==================== Zeitstrahl ==================== */
  .timeline {
    position: relative;
    padding: 1em 0;
    overflow-x: auto;
  }
  .timeline-track {
    position: relative;
    height: 60px;
    background: var(--surface-2);
    border-radius: var(--radius-sm);
    min-width: 900px;
  }
  .timeline-month {
    position: absolute;
    top: 0;
    height: 100%;
    border-right: 1px dashed var(--border);
    font-size: .75em;
    color: var(--text-muted);
    padding: 2px 4px;
  }
  .timeline-ferien {
    position: absolute;
    top: 22px;
    height: 16px;
    background: var(--holiday-bg);
    border-radius: 3px;
  }
  .timeline-dot {
    position: absolute;
    top: 44px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--accent);
    transform: translateX(-50%);
    cursor: pointer;
  }

  /* ==================== Print ==================== */
  @media print {
    .topbar, .sidebar, .fab { display: none; }
    .content { padding: 1em; max-height: none; overflow: visible; }
    .card { page-break-inside: avoid; box-shadow: none; border: 1px solid #ccc; }
  }

  /* ==================== Onboarding ==================== */
  .onboarding {
    text-align: center;
    padding: 3em 2em;
  }
  .onboarding h1 { font-size: 2em; }
  .onboarding .steps {
    display: flex;
    justify-content: center;
    gap: 2em;
    margin: 2em 0;
    flex-wrap: wrap;
  }
  .onboarding .step {
    max-width: 200px;
    text-align: center;
  }
  .onboarding .step .num {
    width: 40px;
    height: 40px;
    background: var(--accent);
    color: #fff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    margin: 0 auto .6em;
  }

  /* ==================== Utility ==================== */
  .muted { color: var(--text-muted); }
  .center { text-align: center; }
  .flex { display: flex; gap: .6em; align-items: center; }
  .flex.wrap { flex-wrap: wrap; }
  .mt-0 { margin-top: 0; }
  .mt-1 { margin-top: .6em; }
  .mt-2 { margin-top: 1em; }
  .hidden { display: none !important; }
  .code-block {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: .8em 1em;
    font-family: 'Monaco', 'Consolas', monospace;
    font-size: .82em;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 300px;
    overflow-y: auto;
  }

  /* Theme toggle pill */
  .theme-toggle {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: .2em .6em;
    font-size: .85em;
  }

  /* Focus-Ring für Barrierefreiheit */
  *:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }

  /* ==================== Import-Hub ==================== */
  .import-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.2em 1.4em;
    margin-bottom: 1em;
  }
  .import-section .section-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 1em;
    margin-bottom: .8em;
  }
  .import-section h3 { margin: 0; display: flex; align-items: center; gap: .5em; }
  .import-section .hint { color: var(--text-muted); font-size: .88em; margin: .3em 0 0; }

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
/* ============================================================================
   Schulleitungs-Cockpit – JavaScript
   Eine einzige HTML-Datei, lokale Arbeit mit File System Access API.
   Kommentare knapp gehalten; ausführlich nur an zentralen Stellen
   (Regel-Engine, Jahreswechsel, Konflikt-Erkennung).
   ============================================================================ */

// ------------------------ Globaler State ------------------------
const State = {
  dirHandle: null,              // FileSystemDirectoryHandle des Schulordners
  dirName: null,                // Anzeige-Name
  termineFile: null,            // Datei-Handle für termine.json
  ferienFile: null,             // Datei-Handle für ferien.json
  settingsFile: null,           // settings.json
  termineData: null,            // geparste termine.json
  ferienData: null,             // geparste ferien.json (Feiertage + Ferien)
  settings: {                   // UI-Einstellungen, in settings.json persistiert
    theme: 'light',
    vertretungsmodus: false,
    vertretungsname: '',
    externeKalender: [],
    kategorieFilter: null,      // null = alle
    checkedItems: {},           // abgehakte Checklisten-Einträge (id -> true)
  },
  currentTab: 'kalender',
  currentView: 'jahr',          // jahr | monat | liste
  currentMonth: new Date(),     // für Monatsansicht
  externeTermine: [],           // eingelesene iCal-Termine
  activeModal: null,
};

// ------------------------ IndexedDB für Ordner-Handle ------------------------
// Wir speichern nur den DirectoryHandle; alle Daten liegen im Dateisystem.
const IDB_NAME = 'schulleitungs-cockpit';
const IDB_STORE = 'handles';

function idbOpen() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => {
      req.result.createObjectStore(IDB_STORE);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function idbGet(key) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, 'readonly');
    const req = tx.objectStore(IDB_STORE).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function idbSet(key, value) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put(value, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

// ------------------------ Helfer ------------------------
const WEEKDAYS_DE = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const WEEKDAYS_DE_SHORT = ['So','Mo','Di','Mi','Do','Fr','Sa'];
const MONTHS_DE = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const MONTHS_DE_SHORT = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];

function uuid() {
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
  });
}

function isoDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function parseIso(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(y, m - 1, d);
}

function formatDateDE(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-');
  return `${d}.${m}.${y}`;
}

function slugify(s) {
  return s
    .toLowerCase()
    .replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss')
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/(^-|-$)/g, '')
    .slice(0, 40);
}

function folderNameForTermin(t) {
  return `${t.datum}_${slugify(t.titel)}`;
}

function getSchuljahrRange(schuljahr) {
  // "2026-27" -> { from: "2026-08-01", to: "2027-07-31" }
  const [y1] = schuljahr.split('-');
  const y1n = parseInt(y1);
  return {
    from: `${y1n}-08-01`,
    to: `${y1n + 1}-07-31`,
  };
}

function currentSchuljahr() {
  // Schuljahr läuft August bis Juli (Niedersachsen)
  const now = new Date();
  const y = now.getFullYear();
  if (now.getMonth() >= 7) return `${y}-${String(y + 1).slice(2)}`;
  return `${y - 1}-${String(y).slice(2)}`;
}

// ------------------------ Toast / Banner ------------------------
function toast(msg, kind = 'info', duration = 2500) {
  const root = document.getElementById('toastRoot');
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(() => el.remove(), duration);
}

// ------------------------ Zwischenablage ------------------------
async function copyToClipboard(text) {
  try {
    await navigator.clipboard.writeText(text);
    toast('In die Zwischenablage kopiert');
  } catch {
    // Fallback
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
    toast('In die Zwischenablage kopiert');
  }
}

// ============================================================================
// ORDNER / DATEI-ZUGRIFF
// ============================================================================

async function pickSchoolFolder() {
  if (!('showDirectoryPicker' in window)) {
    alert('Diese App benötigt die File System Access API und funktioniert aktuell nur in Chrome, Edge oder Brave. Bitte öffnen Sie die Datei in einem dieser Browser.');
    return;
  }
  try {
    const handle = await window.showDirectoryPicker({ id: 'schulordner', mode: 'readwrite' });
    await ensurePermission(handle);
    State.dirHandle = handle;
    State.dirName = handle.name;
    await idbSet('dirHandle', handle);
    await initializeSchoolFolder();
    updateFolderStatus();
    await loadAll();
    render();
    toast(`Ordner "${handle.name}" verbunden`);
    // Nach erstem Ordner-Wählen: Schnellstart anbieten, wenn leer
    if (State.termineData && State.termineData.termine.length === 0) {
      setTimeout(openSchnellstartModal, 200);
    }
  } catch (e) {
    if (e.name !== 'AbortError') console.error(e);
  }
}

async function ensurePermission(handle) {
  const opts = { mode: 'readwrite' };
  if ((await handle.queryPermission(opts)) === 'granted') return true;
  if ((await handle.requestPermission(opts)) === 'granted') return true;
  return false;
}

async function tryRestoreFolder() {
  const handle = await idbGet('dirHandle');
  if (!handle) return false;
  try {
    if ((await handle.queryPermission({ mode: 'readwrite' })) === 'granted') {
      State.dirHandle = handle;
      State.dirName = handle.name;
      await loadAll();
      return true;
    }
    // Berechtigung muss bei nächster Nutzerinteraktion erneut bestätigt werden
    State.dirHandle = handle;
    State.dirName = handle.name;
    return 'needsPermission';
  } catch {
    return false;
  }
}

async function initializeSchoolFolder() {
  if (!State.dirHandle) return;
  // termine.json anlegen, falls nicht vorhanden
  let termineHandle;
  try {
    termineHandle = await State.dirHandle.getFileHandle('termine.json');
  } catch {
    termineHandle = await State.dirHandle.getFileHandle('termine.json', { create: true });
    const initial = {
      schuljahr: currentSchuljahr(),
      schule: { name: '', bundesland: 'DE-NI' },
      termine: [],
      externe_kalender: [],
    };
    await writeJson(termineHandle, initial);
  }
  State.termineFile = termineHandle;

  // settings.json
  try {
    State.settingsFile = await State.dirHandle.getFileHandle('settings.json');
  } catch {
    State.settingsFile = await State.dirHandle.getFileHandle('settings.json', { create: true });
    await writeJson(State.settingsFile, State.settings);
  }

  // _Vorlagen-Ordner anlegen
  try {
    await State.dirHandle.getDirectoryHandle('_Vorlagen', { create: true });
  } catch (e) { console.warn(e); }
}

async function readJson(handle) {
  const file = await handle.getFile();
  const text = await file.text();
  return text.trim() ? JSON.parse(text) : null;
}

async function writeJson(handle, data) {
  const w = await handle.createWritable();
  await w.write(JSON.stringify(data, null, 2));
  await w.close();
}

async function loadAll() {
  if (!State.dirHandle) return;
  try {
    State.termineFile = await State.dirHandle.getFileHandle('termine.json');
    State.termineData = await readJson(State.termineFile);
  } catch (e) {
    // Fehlt noch → initialize
    await initializeSchoolFolder();
    State.termineData = await readJson(State.termineFile);
  }

  try {
    State.settingsFile = await State.dirHandle.getFileHandle('settings.json');
    const s = await readJson(State.settingsFile);
    if (s) State.settings = { ...State.settings, ...s };
  } catch { /* optional */ }

  applySettings();

  // Ferien laden (Cache oder API)
  await loadFerien();

  // Externe Kalender laden
  await loadExterneKalender();
}

async function saveTermine() {
  if (!State.termineFile) return;
  await writeJson(State.termineFile, State.termineData);
}

async function saveSettings() {
  if (!State.settingsFile) return;
  await writeJson(State.settingsFile, State.settings);
}

function applySettings() {
  document.documentElement.setAttribute('data-theme', State.settings.theme || 'light');
  const vb = document.getElementById('vertretungsBanner');
  if (State.settings.vertretungsmodus) {
    vb.classList.remove('hidden');
    vb.textContent = `Vertretungsmodus aktiv — Rückfragen bitte an ${State.settings.vertretungsname || '[Name ergänzen]'}.`;
  } else {
    vb.classList.add('hidden');
  }
}

// ============================================================================
// FERIEN & FEIERTAGE (OpenHolidays API)
// ============================================================================

async function loadFerien() {
  if (!State.dirHandle) return;
  let ferienHandle;
  try {
    ferienHandle = await State.dirHandle.getFileHandle('ferien.json');
    const cached = await readJson(ferienHandle);
    if (cached && isCacheFresh(cached)) {
      State.ferienData = cached;
      return;
    }
  } catch { /* noch nicht vorhanden */ }

  try {
    const freshData = await fetchFerienFromAPI();
    try {
      ferienHandle = await State.dirHandle.getFileHandle('ferien.json', { create: true });
      await writeJson(ferienHandle, freshData);
    } catch (e) { console.warn('Konnte ferien.json nicht schreiben', e); }
    State.ferienData = freshData;
  } catch (e) {
    console.warn('Ferien-API nicht erreichbar, nutze Cache falls vorhanden', e);
    if (!State.ferienData && ferienHandle) {
      try { State.ferienData = await readJson(ferienHandle); } catch {}
    }
  }
  State.ferienFile = ferienHandle;
}

function isCacheFresh(cached) {
  if (!cached.cached_at) return false;
  const age = Date.now() - new Date(cached.cached_at).getTime();
  return age < 30 * 24 * 3600 * 1000; // 30 Tage
}

async function fetchFerienFromAPI() {
  // Zwei aktuelle Schuljahre laden, damit der Jahreswechsel-Assistent alles hat
  const nowY = new Date().getFullYear();
  const from = `${nowY - 1}-01-01`;
  const to = `${nowY + 2}-12-31`;
  const country = 'DE';
  const sub = 'DE-NI';

  const [holidays, schoolHolidays] = await Promise.all([
    fetch(`https://openholidaysapi.org/PublicHolidays?countryIsoCode=${country}&subdivisionCode=${sub}&validFrom=${from}&validTo=${to}&languageIsoCode=DE`).then(r => r.json()),
    fetch(`https://openholidaysapi.org/SchoolHolidays?countryIsoCode=${country}&subdivisionCode=${sub}&validFrom=${from}&validTo=${to}&languageIsoCode=DE`).then(r => r.json()),
  ]);

  return {
    cached_at: new Date().toISOString(),
    feiertage: holidays.map(h => ({
      name: (h.name && h.name[0] ? h.name[0].text : 'Feiertag'),
      startDate: h.startDate,
      endDate: h.endDate,
    })),
    ferien: schoolHolidays.map(h => ({
      name: (h.name && h.name[0] ? h.name[0].text : 'Ferien'),
      startDate: h.startDate,
      endDate: h.endDate,
    })),
  };
}

function isFeiertag(iso) {
  if (!State.ferienData) return null;
  return State.ferienData.feiertage.find(f => iso >= f.startDate && iso <= f.endDate) || null;
}

function isFerientag(iso) {
  if (!State.ferienData) return null;
  return State.ferienData.ferien.find(f => iso >= f.startDate && iso <= f.endDate) || null;
}

// Alle Ferien-Starts/-Enden als "Ankerpunkte" für relative Regeln
function getFerienAnker() {
  if (!State.ferienData) return [];
  const anker = [];
  for (const f of State.ferienData.ferien) {
    anker.push({ label: `${f.name} – Beginn`, datum: f.startDate, type: 'beginn', name: f.name });
    anker.push({ label: `${f.name} – Ende`, datum: f.endDate, type: 'ende', name: f.name });
  }
  return anker;
}

// ============================================================================
// REGEL-ENGINE — Datumsberechnung für wiederkehrende Termine
// ============================================================================
//
// Drei Regeltypen:
//   1. "fest"       → {tag:15, monat:11}              → fester Tag+Monat
//   2. "wochentag"  → {position:"erster", wochentag:"mittwoch", monat:9}
//   3. "relativ"    → {offsetTage:-3, anker:"Herbstferien", ankerTyp:"beginn"}
//
// Für jede Regel gibt es berechneDatum(regel, ferienDaten, jahr).
// Jahr ist das Kalenderjahr, in dem der Termin fällt. Wir nutzen die
// ferienDaten, um bei "relativ"-Regeln den Bezugspunkt aufzulösen.

const WOCHENTAG_MAP = {
  sonntag: 0, montag: 1, dienstag: 2, mittwoch: 3,
  donnerstag: 4, freitag: 5, samstag: 6,
};
const POSITION_MAP = { erster: 0, zweiter: 1, dritter: 2, vierter: 3, letzter: -1 };

function berechneDatum(regel, ferienDaten, jahr) {
  if (!regel) return null;

  if (regel.art === 'fest') {
    const { tag, monat } = regel.details || {};
    if (!tag || !monat) return null;
    return `${jahr}-${String(monat).padStart(2,'0')}-${String(tag).padStart(2,'0')}`;
  }

  if (regel.art === 'wochentag') {
    const { wochentag, position, monat } = regel.details || {};
    const dow = WOCHENTAG_MAP[wochentag];
    const pos = POSITION_MAP[position];
    if (dow === undefined || pos === undefined || !monat) return null;

    if (pos === -1) {
      // letzter Wochentag im Monat
      const lastDay = new Date(jahr, monat, 0);
      const diff = (lastDay.getDay() - dow + 7) % 7;
      const d = new Date(jahr, monat - 1, lastDay.getDate() - diff);
      return isoDate(d);
    }
    // erster/zweiter/dritter/vierter
    const first = new Date(jahr, monat - 1, 1);
    const diff = (dow - first.getDay() + 7) % 7;
    const dayNum = 1 + diff + pos * 7;
    const d = new Date(jahr, monat - 1, dayNum);
    if (d.getMonth() !== monat - 1) return null; // überschritten
    return isoDate(d);
  }

  if (regel.art === 'relativ') {
    const { offsetTage, anker, ankerTyp } = regel.details || {};
    if (!ferienDaten || offsetTage == null || !anker) return null;
    // Passende Ferien im Zieljahr finden. Achtung: Osterferien können über
    // Jahreswechsel gehen, daher ±1 Jahr tolerieren.
    const candidates = ferienDaten.ferien.filter(f => f.name.includes(anker));
    let best = null;
    for (const c of candidates) {
      const dateIso = ankerTyp === 'ende' ? c.endDate : c.startDate;
      const y = parseInt(dateIso.split('-')[0]);
      if (Math.abs(y - jahr) <= 1) {
        // Wähle das Exemplar, dessen Datum am nächsten zum Zieljahr-Beginn liegt
        if (!best || Math.abs(parseInt(dateIso.split('-')[0]) - jahr) < Math.abs(parseInt((ankerTyp === 'ende' ? best.endDate : best.startDate)).split('-')[0] - jahr)) {
          best = c;
        }
      }
    }
    if (!best) return null;
    const ankerDate = parseIso(ankerTyp === 'ende' ? best.endDate : best.startDate);
    ankerDate.setDate(ankerDate.getDate() + parseInt(offsetTage));
    return isoDate(ankerDate);
  }

  return null;
}

// Konflikt-Erkennung: Termin kollidiert, wenn er auf Feiertag/Ferientag fällt
// oder innerhalb ±2 Tagen ein anderer Termin liegt (nur für Vorschläge im
// Jahreswechsel-Assistenten relevant).
function checkKonflikte(iso, alleTermine = [], eigenerId = null) {
  const konflikte = [];
  const f = isFeiertag(iso);
  if (f) konflikte.push(`Fällt auf Feiertag: ${f.name}`);
  const sf = isFerientag(iso);
  if (sf) konflikte.push(`Fällt in Schulferien: ${sf.name}`);
  const d = parseIso(iso);
  for (const t of alleTermine) {
    if (t.id === eigenerId) continue;
    const td = parseIso(t.datum);
    const diff = Math.abs((d - td) / 86400000);
    if (diff <= 2 && diff > 0) konflikte.push(`Nah an "${t.titel}" (${formatDateDE(t.datum)})`);
    if (diff === 0) konflikte.push(`Gleicher Tag wie "${t.titel}"`);
  }
  return konflikte;
}

async function addTermin(t) {
  if (!t.id) t.id = uuid();
  t.erstellt_am = isoDate(new Date());
  t.letzte_aenderung = t.erstellt_am;
  State.termineData.termine.push(t);
  await saveTermine();
  if (t.ordner_anlegen && t.ordner) {
    await ensureTerminOrdner(t);
  }
}

async function updateTermin(id, patch) {
  const idx = State.termineData.termine.findIndex(t => t.id === id);
  if (idx < 0) return;
  const old = State.termineData.termine[idx];
  const neu = { ...old, ...patch, letzte_aenderung: isoDate(new Date()) };
  State.termineData.termine[idx] = neu;
  await saveTermine();

  // Ordner umbenennen, falls Datum geändert und Ordner existiert
  if (patch.datum && patch.datum !== old.datum && old.ordner) {
    const neuerName = folderNameForTermin(neu);
    try {
      await renameFolder(old.ordner, neuerName);
      neu.ordner = neuerName;
      State.termineData.termine[idx] = neu;
      await saveTermine();
      const hinweis = `Ordner umbenannt von ${old.ordner} auf ${neuerName}. Die Briefe darin sollten auch auf das neue Datum aktualisiert werden. Soll Cowork das übernehmen?`;
      showCoworkBridge(neu, hinweis, 'termin-verschoben');
    } catch (e) {
      console.warn('Ordner konnte nicht umbenannt werden', e);
      toast('Ordner konnte nicht umbenannt werden – Details in der Konsole.');
    }
  }
  return neu;
}

async function deleteTermin(id) {
  State.termineData.termine = State.termineData.termine.filter(t => t.id !== id);
  await saveTermine();
}

async function ensureTerminOrdner(t) {
  if (!State.dirHandle) return;
  const name = folderNameForTermin(t);
  t.ordner = name;
  const folder = await State.dirHandle.getDirectoryHandle(name, { create: true });
  // Vorlage kopieren?
  if (t.vorlage) {
    await copyVorlageToFolder(t.vorlage, folder);
  }
  await saveTermine();
}

async function renameFolder(oldName, newName) {
  // File System Access API hat kein natives rename. Wir kopieren die Dateien
  // in einen neuen Ordner und löschen den alten.
  const oldDir = await State.dirHandle.getDirectoryHandle(oldName);
  const newDir = await State.dirHandle.getDirectoryHandle(newName, { create: true });
  for await (const [name, handle] of oldDir.entries()) {
    if (handle.kind === 'file') {
      const file = await handle.getFile();
      const newFile = await newDir.getFileHandle(name, { create: true });
      const w = await newFile.createWritable();
      await w.write(await file.arrayBuffer());
      await w.close();
    }
  }
  await State.dirHandle.removeEntry(oldName, { recursive: true });
}

async function copyVorlageToFolder(vorlagePfad, zielFolder) {
  try {
    const vorlagenDir = await State.dirHandle.getDirectoryHandle('_Vorlagen');
    const dateiname = vorlagePfad.split('/').pop();
    const vorlageHandle = await vorlagenDir.getFileHandle(dateiname);
    const file = await vorlageHandle.getFile();
    const ziel = await zielFolder.getFileHandle(dateiname, { create: true });
    const w = await ziel.createWritable();
    await w.write(await file.arrayBuffer());
    await w.close();
  } catch (e) {
    console.warn('Vorlage konnte nicht kopiert werden', e);
  }
}

async function listVorlagen() {
  if (!State.dirHandle) return [];
  try {
    const dir = await State.dirHandle.getDirectoryHandle('_Vorlagen');
    const result = [];
    for await (const [name, handle] of dir.entries()) {
      if (handle.kind === 'file') {
        const file = await handle.getFile();
        result.push({ name, size: file.size, lastModified: file.lastModified, handle });
      }
    }
    return result;
  } catch { return []; }
}

async function listDateienInTerminOrdner(ordnerName) {
  if (!State.dirHandle) return [];
  try {
    const dir = await State.dirHandle.getDirectoryHandle(ordnerName);
    const result = [];
    for await (const [name, handle] of dir.entries()) {
      if (handle.kind === 'file') {
        const file = await handle.getFile();
        result.push({ name, size: file.size, lastModified: file.lastModified });
      }
    }
    return result;
  } catch { return []; }
}

async function getVorlagenPlatzhalter(handle) {
  // Nur Textdateien analysieren; docx ist binär.
  try {
    const file = await handle.getFile();
    if (!/\.(txt|md|html|csv)$/i.test(file.name)) return [];
    const text = await file.text();
    const set = new Set();
    const re = /\{[A-ZÄÖÜ_]+\}/g;
    let m;
    while ((m = re.exec(text))) set.add(m[0]);
    return Array.from(set);
  } catch { return []; }
}

async function loadExterneKalender() {
  State.externeTermine = [];
  if (!State.settings.externeKalender) return;
  for (const cal of State.settings.externeKalender) {
    try {
      const res = await fetch(cal.url);
      const text = await res.text();
      const parsed = parseIcal(text);
      parsed.forEach(t => { t.quelle = cal.name; });
      State.externeTermine.push(...parsed);
    } catch (e) {
      console.warn(`iCal "${cal.name}" konnte nicht geladen werden`, e);
    }
  }
}

function parseIcal(text) {
  // Sehr minimaler iCal-Parser: nur VEVENT mit DTSTART und SUMMARY
  const events = [];
  const lines = text.split(/\r?\n/);
  let cur = null;
  for (const line of lines) {
    if (line === 'BEGIN:VEVENT') cur = {};
    else if (line === 'END:VEVENT') { if (cur && cur.datum && cur.titel) events.push(cur); cur = null; }
    else if (cur) {
      const [key, ...rest] = line.split(':');
      const val = rest.join(':');
      if (key.startsWith('DTSTART')) {
        const raw = val.replace(/\D/g, '');
        if (raw.length >= 8) cur.datum = `${raw.slice(0,4)}-${raw.slice(4,6)}-${raw.slice(6,8)}`;
      } else if (key === 'SUMMARY') cur.titel = val;
      else if (key === 'DESCRIPTION') cur.beschreibung = val;
    }
  }
  return events;
}

function exportIcal() {
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Schulleitungs-Cockpit//DE'];
  for (const t of State.termineData.termine) {
    if (!t.datum) continue;
    const dt = t.datum.replace(/-/g, '');
    lines.push('BEGIN:VEVENT');
    lines.push(`UID:${t.id}@schulleitungs-cockpit`);
    lines.push(`DTSTART;VALUE=DATE:${dt}`);
    lines.push(`DTEND;VALUE=DATE:${dt}`);
    lines.push(`SUMMARY:${(t.titel || '').replace(/\n/g, ' ')}`);
    if (t.beschreibung) lines.push(`DESCRIPTION:${t.beschreibung.replace(/\n/g, '\\n')}`);
    if (t.ort) lines.push(`LOCATION:${t.ort}`);
    lines.push('END:VEVENT');
  }
  lines.push('END:VCALENDAR');
  const blob = new Blob([lines.join('\r\n')], { type: 'text/calendar' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `schulkalender-${State.termineData.schuljahr || 'aktuell'}.ics`;
  a.click();
  URL.revokeObjectURL(url);
}

// Findet Tage zwischen einem Feiertag und einem Wochenende (Brückentage).
// Einsatzzweck: Schulleitung will z.B. vor Himmelfahrt einen schulfreien Tag
// festlegen (bewegliche Ferientage dürfen Schulen in NI selbst setzen).
function findBrueckentage(fromIso, toIso) {
  if (!State.ferienData) return [];
  const out = [];
  const from = parseIso(fromIso);
  const to = parseIso(toIso);
  for (const ft of State.ferienData.feiertage) {
    const d = parseIso(ft.startDate);
    if (d < from || d > to) continue;
    const dow = d.getDay(); // 0=So, 6=Sa
    if (dow === 2) {
      // Dienstag = Montag davor ist Brückentag
      const br = new Date(d); br.setDate(d.getDate() - 1);
      out.push({ datum: isoDate(br), brücke: `Montag vor ${ft.name}`, anlass: ft.name });
    } else if (dow === 4) {
      // Donnerstag = Freitag danach ist Brückentag
      const br = new Date(d); br.setDate(d.getDate() + 1);
      out.push({ datum: isoDate(br), brücke: `Freitag nach ${ft.name}`, anlass: ft.name });
    }
  }
  return out;
}

// Einfacher Natural-Language-Parser für die Schnelleingabe.
// Unterstützt: "Elternabend 15.9. 19:30", "Konferenz am 3.10.2026 14:00",
// "Zeugnisvergabe morgen", "... nächsten Dienstag", "... am Freitag".
function parseQuickAdd(text) {
  if (!text) return null;
  let datum = null;
  let uhrzeit = null;
  let titel = text.trim();
  const now = new Date();

  // Uhrzeit: HH:MM, HH.MM oder "19 Uhr"
  const zeitRe = /\b(\d{1,2})[:.](\d{2})\s*(?:Uhr|h)?\b|\b(\d{1,2})\s*Uhr\b/i;
  const mZeit = titel.match(zeitRe);
  if (mZeit) {
    const h = parseInt(mZeit[1] || mZeit[3]);
    const m = parseInt(mZeit[2] || '0');
    uhrzeit = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
    titel = titel.replace(mZeit[0], '').trim();
  }

  // Datum: 15.9., 15.09., 15.09.2026, 2026-09-15
  const mDeutsch = titel.match(/\b(\d{1,2})\.(\d{1,2})\.(\d{2,4})?\b/);
  const mIso = titel.match(/\b(\d{4})-(\d{2})-(\d{2})\b/);
  if (mDeutsch) {
    let y = mDeutsch[3] ? parseInt(mDeutsch[3]) : now.getFullYear();
    if (y < 100) y += 2000;
    // Wenn Datum in der Vergangenheit liegt und kein Jahr angegeben war → nächstes Jahr
    if (!mDeutsch[3]) {
      const test = new Date(y, parseInt(mDeutsch[2]) - 1, parseInt(mDeutsch[1]));
      if (test < now) y += 1;
    }
    datum = `${y}-${String(mDeutsch[2]).padStart(2,'0')}-${String(mDeutsch[1]).padStart(2,'0')}`;
    titel = titel.replace(mDeutsch[0], '').trim();
  } else if (mIso) {
    datum = mIso[0];
    titel = titel.replace(mIso[0], '').trim();
  } else {
    // Keywords: heute, morgen, übermorgen, Wochentage
    const kw = titel.toLowerCase();
    if (/\bheute\b/.test(kw)) { datum = isoDate(now); titel = titel.replace(/\bheute\b/i, '').trim(); }
    else if (/\bmorgen\b/.test(kw)) { const d = new Date(now); d.setDate(d.getDate()+1); datum = isoDate(d); titel = titel.replace(/\bmorgen\b/i, '').trim(); }
    else if (/\bübermorgen\b/.test(kw)) { const d = new Date(now); d.setDate(d.getDate()+2); datum = isoDate(d); titel = titel.replace(/\bübermorgen\b/i, '').trim(); }
    else {
      // "nächsten Dienstag" / "am Freitag"
      const wtMatch = kw.match(/\b(?:nächsten?|kommenden|am)\s+(montag|dienstag|mittwoch|donnerstag|freitag|samstag|sonntag)\b/);
      if (wtMatch) {
        const target = WOCHENTAG_MAP[wtMatch[1]];
        const d = new Date(now);
        let addDays = (target - d.getDay() + 7) % 7;
        if (addDays === 0) addDays = 7;
        d.setDate(d.getDate() + addDays);
        datum = isoDate(d);
        titel = titel.replace(new RegExp(wtMatch[0], 'i'), '').trim();
      }
    }
  }

  // Füllwörter entfernen
  titel = titel.replace(/\b(am|um|für|ab|von|den)\b/gi, '').replace(/\s{2,}/g, ' ').trim();
  titel = titel.replace(/[,.;]+$/, '').trim();

  return { titel, datum, uhrzeit };
}

// Einfacher iCal-Text-Parser für den Import aus eingefügtem Text (z.B. Mail).
// Erkennt Datumszeilen und nimmt den Rest als Titel.
function parseTextTermine(text) {
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const found = [];
  const datumRe = /\b(\d{1,2})[.\-/](\d{1,2})[.\-/](\d{2,4})\b/;
  for (const line of lines) {
    const m = line.match(datumRe);
    if (!m) continue;
    let y = parseInt(m[3]);
    if (y < 100) y += 2000;
    const iso = `${y}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`;
    const rest = line.replace(m[0], '').replace(/^[\s:,\-–—]+|[\s:,\-–—]+$/g, '').trim();
    if (rest) found.push({ titel: rest.slice(0, 120), datum: iso });
  }
  return found;
}

// Duplikat-Check für Import-Vorschauen
function isLikelyDuplicate(vorschlag, termine) {
  return termine.some(t =>
    t.datum === vorschlag.datum &&
    (t.titel || '').toLowerCase().trim() === (vorschlag.titel || '').toLowerCase().trim()
  );
}

async function handleIcsUpload() {
  try {

// ---- Jahresansicht (12 Mini-Monate) ----
function renderJahresansicht(root) {
  const refDate = State.currentMonth;
  // Schuljahr-Ansicht: August bis Juli
  const startY = refDate.getMonth() >= 7 ? refDate.getFullYear() : refDate.getFullYear() - 1;
  const months = [];
  for (let i = 0; i < 12; i++) {
    const m = (7 + i) % 12;
    const y = startY + (7 + i >= 12 ? 1 : 0);
    months.push({ y, m });
  }
  const html = `<div class="year-grid">${months.map(({ y, m }) => miniMonthHtml(y, m)).join('')}</div>`;
  root.innerHTML = html;
  root.querySelectorAll('.month-mini h4').forEach(h => h.addEventListener('click', (e) => {
    const [y, m] = e.currentTarget.dataset.date.split('-').map(Number);
    State.currentMonth = new Date(y, m, 1);
    State.currentView = 'monat';
    render();
  }));
}

function miniMonthHtml(y, m) {
  const first = new Date(y, m, 1);
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  // Montag als erster Wochentag
  let offset = first.getDay() - 1;
  if (offset < 0) offset = 6;
  const cells = [];
  for (let i = 0; i < offset; i++) cells.push('<div class="d other-month"></div>');
  for (let d = 1; d <= daysInMonth; d++) {
    const iso = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = iso === isoDate(new Date());
    const termine = getTermineAm(iso);
    const ft = isFeiertag(iso);
    const sh = isFerientag(iso);
    const cls = ['d'];
    if (isToday) cls.push('today');
    if (sh) cls.push('holiday');
    if (ft) cls.push('feiertag');
    if (termine.length > 0) cls.push('has-termin');
    if (termine.length > 2) cls.push('many');
    const title = [ft?.name, sh?.name, ...termine.map(t => t.titel)].filter(Boolean).join('\n');
    cells.push(`<div class="${cls.join(' ')}" title="${escapeHtml(title)}" data-date="${iso}">${d}</div>`);
  }
  return `
    <div class="month-mini">
      <h4 data-date="${y}-${m}">${MONTHS_DE[m]} ${y}</h4>
      <div class="mini-grid">
        ${['Mo','Di','Mi','Do','Fr','Sa','So'].map(d => `<div class="dow">${d}</div>`).join('')}
        ${cells.join('')}
      </div>
    </div>`;
}

// ---- Monatsansicht ----
function renderMonatsansicht(root) {
  const d = State.currentMonth;
  const y = d.getFullYear();
  const m = d.getMonth();
  const first = new Date(y, m, 1);
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  let offset = first.getDay() - 1;
  if (offset < 0) offset = 6;

  root.innerHTML = `
    <div class="month-nav">
      <button class="ghost" id="prevMonth" aria-label="Vorheriger Monat">‹</button>
      <h2>${MONTHS_DE[m]} ${y}</h2>
      <button class="ghost" id="nextMonth" aria-label="Nächster Monat">›</button>
      <button class="ghost" id="todayBtn">Heute</button>
    </div>
    <div class="month-full" id="monthGrid"></div>
  `;
  document.getElementById('prevMonth').addEventListener('click', () => { State.currentMonth = new Date(y, m - 1, 1); render(); });
  document.getElementById('nextMonth').addEventListener('click', () => { State.currentMonth = new Date(y, m + 1, 1); render(); });
  document.getElementById('todayBtn').addEventListener('click', () => { State.currentMonth = new Date(); render(); });

  const grid = document.getElementById('monthGrid');
  ['Mo','Di','Mi','Do','Fr','Sa','So'].forEach(dw => {
    const el = document.createElement('div'); el.className = 'dow-head'; el.textContent = dw; grid.appendChild(el);
  });
  // Tage vorheriger Monat
  const prevDays = new Date(y, m, 0).getDate();
  for (let i = offset - 1; i >= 0; i--) {
    const day = prevDays - i;
    grid.appendChild(makeMonthCell(new Date(y, m - 1, day), true));
  }
  for (let day = 1; day <= daysInMonth; day++) {
    grid.appendChild(makeMonthCell(new Date(y, m, day), false));
  }
  // Auf ganze Wochen auffüllen
  const total = offset + daysInMonth;
  const tail = (7 - (total % 7)) % 7;
  for (let i = 1; i <= tail; i++) grid.appendChild(makeMonthCell(new Date(y, m + 1, i), true));
}

function makeMonthCell(date, otherMonth) {
  const iso = isoDate(date);
  const isToday = iso === isoDate(new Date());
  const ft = isFeiertag(iso);
  const sh = isFerientag(iso);
  const cell = document.createElement('div');
  cell.className = 'cell' + (otherMonth ? ' other-month' : '') + (isToday ? ' today' : '') + (sh ? ' holiday' : '');
  cell.dataset.date = iso;
  const fragments = [`<span class="daynum">${date.getDate()}</span>`];
  if (ft) fragments.push(`<span class="feiertag-label">${escapeHtml(ft.name)}</span>`);
  const termine = getTermineAm(iso).filter(t => !State.settings.kategorieFilter || State.settings.kategorieFilter === t.kategorie);
  for (const t of termine) {
    const kon = checkKonflikte(iso, State.termineData.termine, t.id);
    fragments.push(`<span class="termin-chip ${kon.length ? 'conflict' : ''}" data-cat="${t.kategorie || 'sonstiges'}" data-id="${t.id}" draggable="true" title="${escapeHtml(t.titel)}${kon.length ? ' — ' + escapeHtml(kon.join(', ')) : ''}">${escapeHtml(t.titel)}</span>`);
  }
  // externe Termine
  const ext = State.externeTermine.filter(e => e.datum === iso);
  for (const e of ext) {
    fragments.push(`<span class="termin-chip external" title="${escapeHtml(e.quelle)}: ${escapeHtml(e.titel)}">${escapeHtml(e.titel)}</span>`);
  }
  cell.innerHTML = fragments.join('');
  // Click auf Zelle (leer): neuer Termin
  cell.addEventListener('click', (e) => {
    if (e.target.classList.contains('termin-chip')) {
      const id = e.target.dataset.id;
      if (id) openTerminDetails(id);
      return;
    }
    openTerminModal({ datum: iso });
  });
  // Drag & Drop
  cell.addEventListener('dragover', (ev) => { ev.preventDefault(); cell.classList.add('drag-over'); });
  cell.addEventListener('dragleave', () => cell.classList.remove('drag-over'));
  cell.addEventListener('drop', async (ev) => {
    ev.preventDefault();
    cell.classList.remove('drag-over');
    const id = ev.dataTransfer.getData('text/plain');
    if (!id) return;
    await updateTermin(id, { datum: iso });
    render();
  });
  cell.querySelectorAll('.termin-chip[data-id]').forEach(chip => {
    chip.addEventListener('dragstart', (ev) => {
      ev.dataTransfer.setData('text/plain', chip.dataset.id);
      chip.classList.add('dragging');
    });
    chip.addEventListener('dragend', () => chip.classList.remove('dragging'));
  });
  return cell;
}

function computeJahreswechsel(zielSchuljahr) {
  const [yStart] = zielSchuljahr.split('-');
  const startYear = parseInt(yStart);
  const result = [];
  for (const t of State.termineData.termine) {
    if (!t.regel) continue; // einmalige Termine werden nicht übertragen
    // Passendes Kalenderjahr finden: Termin im August-Dezember → startYear; Januar-Juli → startYear+1
    const altMonat = parseInt(t.datum.split('-')[1]);
    const jahr = altMonat >= 8 ? startYear : startYear + 1;
    const neuDatum = berechneDatum(t.regel, State.ferienData, jahr);
    let konflikte = [];
    let status = 'ok';
    if (!neuDatum) { status = 'error'; }
    else {
      konflikte = checkKonflikte(neuDatum, State.termineData.termine, t.id);
      if (konflikte.length) status = 'konflikt';
    }
    result.push({
      id: t.id,
      titel: t.titel,
      altDatum: t.datum,
      neuDatum,
      regel: t.regel,
      status,
      konflikte,
      original: t,
    });
  }
  return result;
}

function statusBadge(p) {
  if (p.status === 'ok') return '<span class="tag ok">Übernommen</span>';
  if (p.status === 'konflikt') return `<span class="tag warn" title="${escapeHtml(p.konflikte.join(', '))}">Konflikt</span>`;
  return '<span class="tag danger">Berechnung fehlgeschlagen</span>';
}

async function uebernehmeJahresplan(preview, zielSchuljahr) {
  // Für jeden Termin mit neuDatum einen neuen Termin ins aktuelle termineData schreiben.
  // Bestehende Termine des Zieljahres für die selbe Serie ggf. überschreiben.
  const neueListe = [];
  for (const p of preview) {
    if (!p.neuDatum) continue;
    const n = {
      ...p.original,
      id: uuid(),
      datum: p.neuDatum,
      ordner: p.original.ordner_anlegen ? `${p.neuDatum}_${slugify(p.original.titel)}` : null,
      erstellt_am: isoDate(new Date()),
      letzte_aenderung: isoDate(new Date()),
    };
    neueListe.push(n);
    if (n.ordner_anlegen && n.ordner) {
      try { await State.dirHandle.getDirectoryHandle(n.ordner, { create: true }); } catch (e) { console.warn(e); }
    }
  }
  State.termineData.termine.push(...neueListe);
  State.termineData.schuljahr = zielSchuljahr;
  await saveTermine();
  toast(`${neueListe.length} Termine für ${zielSchuljahr} übernommen`);
  const txt = coworkTextJahreswechsel(preview, zielSchuljahr);
  showCoworkBridge(null, 'Jahresplan wurde übernommen. Möchten Sie, dass Cowork die Briefvorlagen in die neuen Ordner kopiert und die Daten aktualisiert?', 'jahreswechsel', txt);
  render();
}

function coworkTextJahreswechsel(preview, zielSchuljahr) {
  const ok = preview.filter(p => p.neuDatum);
  return [
    `Jahreswechsel ins Schuljahr ${zielSchuljahr}:`,
    `Bitte im Schulordner ${State.dirName || '[Schulordner]'} folgendes erledigen:`,
    '',
    '1. Prüfe jeden der folgenden neuen Termin-Ordner.',
    '2. Kopiere die passenden Briefvorlagen aus dem Vorjahresordner.',
    '3. Aktualisiere die Platzhalter ({DATUM}, {KLASSE}, {UHRZEIT}, etc.) auf das neue Datum.',
    '',
    'Termine:',
    ...ok.map(p => `- ${p.titel}: ${formatDateDE(p.altDatum)} → ${formatDateDE(p.neuDatum)}${p.konflikte.length ? '  [Konflikt: ' + p.konflikte.join('; ') + ']' : ''}`),
  ].join('\n');
}

async function uploadVorlage() {
  if (!State.dirHandle) return;
  try {
    const [fileHandle] = await window.showOpenFilePicker({ multiple: false });
    const file = await fileHandle.getFile();
    const dir = await State.dirHandle.getDirectoryHandle('_Vorlagen', { create: true });
    const ziel = await dir.getFileHandle(file.name, { create: true });
    const w = await ziel.createWritable();
    await w.write(await file.arrayBuffer());
    await w.close();
    toast(`Vorlage ${file.name} hinzugefügt`);
    render();
  } catch (e) {
    if (e.name !== 'AbortError') console.error(e);
  }
}

// ---- Zeitstrahl ----
function renderZeitstrahl(root) {
  const sj = State.termineData.schuljahr || currentSchuljahr();
  const { from, to } = getSchuljahrRange(sj);
  const startMs = parseIso(from).getTime();
  const endMs = parseIso(to).getTime();
  const span = endMs - startMs;
  const pct = ms => ((ms - startMs) / span) * 100;
  const monate = [];
  for (let m = 0; m < 12; m++) {
    const y = parseInt(from.split('-')[0]) + (7 + m >= 12 ? 1 : 0);
    const mi = (7 + m) % 12;
    const d = new Date(y, mi, 1).getTime();
    monate.push({ label: MONTHS_DE_SHORT[mi], left: pct(d) });
  }
  const ferien = (State.ferienData?.ferien || []).filter(f => f.startDate >= from && f.endDate <= to);
  const termine = State.termineData.termine.filter(t => t.datum >= from && t.datum <= to);

  root.innerHTML = `
    <h1>Zeitstrahl Schuljahr ${sj}</h1>
    <p class="lead">Ein Blick aufs ganze Jahr.</p>
    <div class="card">
      <div class="timeline">
        <div class="timeline-track">
          ${monate.map(m => `<div class="timeline-month" style="left:${m.left}%">${m.label}</div>`).join('')}
          ${ferien.map(f => {
            const l = pct(parseIso(f.startDate).getTime());
            const r = pct(parseIso(f.endDate).getTime());
            return `<div class="timeline-ferien" style="left:${l}%;width:${r-l}%" title="${escapeHtml(f.name)}"></div>`;
          }).join('')}
          ${termine.map(t => `<div class="timeline-dot" style="left:${pct(parseIso(t.datum).getTime())}%" title="${escapeHtml(t.titel)} (${formatDateDE(t.datum)})" data-id="${t.id}"></div>`).join('')}
        </div>
      </div>
    </div>
  `;
  root.querySelectorAll('.timeline-dot').forEach(el => el.addEventListener('click', () => openTerminDetails(el.dataset.id)));
}

  const in7 = new Date(heute); in7.setDate(in7.getDate() + 7);
  const inMonat = new Date(heute.getFullYear(), heute.getMonth() + 1, 0);

  const woche = State.termineData.termine
    .filter(t => t.datum >= isoDate(heute) && t.datum <= isoDate(in7))
    .sort((a,b) => a.datum.localeCompare(b.datum));
  const monat = State.termineData.termine
    .filter(t => t.datum >= isoDate(heute) && t.datum <= isoDate(inMonat))
    .sort((a,b) => a.datum.localeCompare(b.datum));
  const ueberfaellig = State.termineData.termine
    .filter(t => t.datum < isoDate(heute) && !State.settings.checkedItems[t.id])
    .sort((a,b) => b.datum.localeCompare(a.datum))
    .slice(0, 5);

  const reminder = getAktiveReminder();

  const stats = computeStats();
  side.innerHTML = `
    <div class="stats">
      <div class="stat"><div class="num">${stats.monat}</div><div class="lbl">Termine diesen Monat</div></div>
      <div class="stat"><div class="num">${stats.mitBrief}</div><div class="lbl">Mit Brief-Ordner</div></div>
      <div class="stat"><div class="num">${stats.konflikte}</div><div class="lbl">Konflikte</div></div>
      <div class="stat"><div class="num">${stats.wiederkehrend}</div><div class="lbl">Wiederkehrend</div></div>
    </div>

    <h3>Diese Woche</h3>
    ${woche.length ? woche.map(t => checklistItemHtml(t)).join('') : '<p class="muted" style="font-size:.9em">Keine Termine in den nächsten 7 Tagen.</p>'}

    <h3>Fällige Reminder</h3>
    ${reminder.length ? reminder.map(r => `
      <div class="checklist-item ${r.ueberfaellig?'overdue':''}">
        <div>
          <div class="title">${escapeHtml(r.titel)}</div>
          <div class="meta">${r.label} · ${formatDateDE(r.terminDatum)}</div>
        </div>
      </div>`).join('') : '<p class="muted" style="font-size:.9em">Nichts Fälliges.</p>'}

    <h3>Dieser Monat</h3>
    ${monat.length ? monat.slice(0, 10).map(t => checklistItemHtml(t)).join('') : '<p class="muted" style="font-size:.9em">Keine weiteren Termine diesen Monat.</p>'}

    ${ueberfaellig.length ? '<h3>Überfällig</h3>' + ueberfaellig.map(t => checklistItemHtml(t, true)).join('') : ''}
  `;
  side.querySelectorAll('.checklist-item input').forEach(cb => {
    cb.addEventListener('change', async (e) => {
      const id = e.target.dataset.id;
      State.settings.checkedItems[id] = e.target.checked;
      await saveSettings();
      renderSidebar();
    });
  });
  side.querySelectorAll('.checklist-item').forEach(el => {
    const id = el.querySelector('input')?.dataset.id;
    if (!id) return;
    el.addEventListener('click', (e) => {
      if (e.target.tagName === 'INPUT') return;
      openTerminDetails(id);
    });
  });
}

function checklistItemHtml(t, overdue = false) {
  const done = !!State.settings.checkedItems[t.id];
  return `
    <div class="checklist-item ${done?'done':''} ${overdue?'overdue':''}">
      <input type="checkbox" data-id="${t.id}" ${done?'checked':''} aria-label="${escapeHtml(t.titel)} abhaken" />
      <div>
        <div class="title">${escapeHtml(t.titel)}</div>
        <div class="meta">${formatDateDE(t.datum)}${t.uhrzeit?' · '+t.uhrzeit:''}${t.zielgruppe?' · '+escapeHtml(t.zielgruppe):''}</div>
      </div>
    </div>`;
}

function computeStats() {
  const heute = new Date();
  const mStart = isoDate(new Date(heute.getFullYear(), heute.getMonth(), 1));
  const mEnd = isoDate(new Date(heute.getFullYear(), heute.getMonth()+1, 0));
  const monat = State.termineData.termine.filter(t => t.datum >= mStart && t.datum <= mEnd);
  return {
    monat: monat.length,
    mitBrief: monat.filter(t => t.ordner).length,
    konflikte: State.termineData.termine.filter(t => checkKonflikte(t.datum, State.termineData.termine, t.id).length).length,
    wiederkehrend: State.termineData.termine.filter(t => t.regel).length,
  };
}

function getAktiveReminder() {
  const out = [];
  const heute = new Date();
  const offsetMap = { '1 Tag vorher': 1, '1 Woche vorher': 7, '2 Wochen vorher': 14, '1 Monat vorher': 30 };
  for (const t of State.termineData.termine) {
    if (!t.reminder) continue;
    for (const r of t.reminder) {
      if (!r.aktiv) continue;
      const off = offsetMap[r.zeitpunkt] || 0;
      const rd = parseIso(t.datum);
      rd.setDate(rd.getDate() - off);
      const rdIso = isoDate(rd);
      const heuteIso = isoDate(heute);
      if (rdIso <= heuteIso && t.datum >= heuteIso) {
        out.push({
          titel: t.titel,
          label: r.zeitpunkt,
          terminDatum: t.datum,
          reminderDatum: rdIso,
          ueberfaellig: rdIso < heuteIso,
        });
      }
    }
  }
  return out.sort((a,b) => a.reminderDatum.localeCompare(b.reminderDatum));
}

      modal.querySelector('#regelMonatFest').value = t.regel.details.monat;

  });

    const sel = modal.querySelector('#tVorlage');
    vs.forEach(v => {
      const o = document.createElement('option');
      o.value = `_Vorlagen/${v.name}`;
      o.textContent = v.name;
      if (t.vorlage === o.value) o.selected = true;
      sel.appendChild(o);
    });
    if (t.vorlage) {
      modal.querySelector('#tVorlageChk').checked = true;
      modal.querySelector('#vorlageFeld').classList.remove('hidden');

      reminder: modal.querySelector('#tReminderChk').checked ? [{ zeitpunkt: modal.querySelector('#tReminder').value, aktiv: true }] : [],

      alert('Bitte einen Titel eingeben — sonst kann der Termin nicht gespeichert werden.');
      return;
    }

    if (typSel.value === 'einmalig') {
      data.datum = modal.querySelector('#tDatum').value;
      if (!data.datum) { alert('Bitte ein Datum wählen.'); return; }
    } else {
      const art = regelArt.value;
      let regel;
      const y = new Date().getFullYear();
      if (art === 'fest') {
        regel = { art, details: { tag: parseInt(modal.querySelector('#regelTag').value), monat: parseInt(modal.querySelector('#regelMonatFest').value) } };

      data.regel = regel;
      const berechnet = berechneDatum(regel, State.ferienData, y);
      if (!berechnet) { alert('Das Datum konnte aus der Regel nicht berechnet werden. Bitte Werte prüfen.'); return; }
      data.datum = berechnet;
    }

    if (t.id) await updateTermin(t.id, data);
    else await addTermin(data);

    closeModal();
    render();
  });

  if (t.id) {
    modal.querySelector('#btnDelete').addEventListener('click', async () => {
      if (confirm('Termin wirklich löschen? Zugehörige Ordner bleiben bestehen.')) {
        await deleteTermin(t.id);
        closeModal();
        render();
      }
    });
  }
}
