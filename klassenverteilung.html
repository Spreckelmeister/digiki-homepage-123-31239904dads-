function QRDisplay({ data, size }) {
  const ref = useRef(null), prev = useRef(""), sz = size || 70;
  useEffect(() => {
    if (!ref.current || !data || !window.QRCode) return;
    if (prev.current === data) return;
    prev.current = data;
    ref.current.innerHTML = "";
    try {
      new window.QRCode(ref.current, { text: data, width: sz, height: sz, colorDark: C.primary, colorLight: "#fff" });
    } catch (e) {}
  }, [data, sz]);
  return h("div", { ref, style: { display: "inline-block" } });
}

function QRScanner({ onScan, onClose }) {
  const vRef = useRef(null), sRef = useRef(null), iRef = useRef(null);
  const scanRef = useRef(onScan);
  const [err, setErr] = useState(null);
  useEffect(() => { scanRef.current = onScan; }, [onScan]);
  useEffect(() => {
    let cancelled = false;
    const stop = () => {
      if (iRef.current) clearInterval(iRef.current);
      if (sRef.current) sRef.current.getTracks().forEach((t) => t.stop());
    };
    (async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        if (cancelled) { stream.getTracks().forEach((t) => t.stop()); return; }
        sRef.current = stream;
        if (vRef.current) { vRef.current.srcObject = stream; vRef.current.play(); }
        if ("BarcodeDetector" in window) {
          const det = new BarcodeDetector({ formats: ["qr_code"] });
          iRef.current = setInterval(async () => {
            if (!vRef.current || vRef.current.readyState < 2) return;
            try {
              const b = await det.detect(vRef.current);
              if (b.length > 0) { scanRef.current(b[0].rawValue); stop(); }
            } catch (e) {}
          }, 400);
        } else setErr("BarcodeDetector nicht verfügbar. Bitte Code manuell eingeben.");
      } catch (e) {
        setErr("Kamera nicht verfügbar.");
      }
    })();
    return () => { cancelled = true; stop(); };
  }, []);
  return h("div", { style: { textAlign: "center" } },
    err
      ? h("div", { style: { padding: 16, color: C.danger, fontSize: 13 } }, err)
      : h("div", { style: { position: "relative", borderRadius: 12, overflow: "hidden", marginBottom: 10 } },
          h("video", { ref: vRef, style: { width: "100%", maxWidth: 320, borderRadius: 12 }, playsInline: true, muted: true })
        ),
    h(Btn, { onClick: onClose, v: "ghost", small: true }, "Schließen")
  );
}

function genCode(n, id) {
  return n.trim().split(/\s+/).map((p) => (p[0] || "").toUpperCase()).join("").slice(0, 2) + String(id).padStart(2, "0");
}

function normalizeStudent(s) {
  return {
    id: s.id,
    name: s.name || "",
    gender: s.gender === "w" ? "w" : "m",
    wishes: Array.isArray(s.wishes) ? s.wishes : [],
    noGo: Array.isArray(s.noGo) ? s.noGo : [],
    note: s.note || "",
    code: s.code || genCode(s.name || "XX", s.id),
    siblings: Array.isArray(s.siblings) ? s.siblings : [],
    prevClass: s.prevClass || "",
    lockedClass: (typeof s.lockedClass === "number" && s.lockedClass > 0) ? s.lockedClass : null
  };
}

function calcScore(st, clStudents, cfg, total, nCls) {
  let s = 0;
  const ids = clStudents.map((x) => x.id);
  if (cfg.wishWeight > 0) st.wishes.forEach((w) => { if (ids.includes(w)) s += cfg.wishWeight * 10; });
  st.noGo.forEach((ng) => { if (ids.includes(ng)) s -= 100; });
  if (cfg.genderBalance) {
    const b = clStudents.filter((x) => x.gender === "m").length;
    const g = clStudents.filter((x) => x.gender === "w").length;
    s -= (st.gender === "m" ? Math.abs(b + 1 - g) : Math.abs(b - g - 1)) * 3;
  }
  if (cfg.distributeNotes && st.note) s -= clStudents.filter((x) => x.note).length * 5;
  const sibs = st.siblings || [];
  if (cfg.siblingRule === "separate") sibs.forEach((sib) => { if (ids.includes(sib)) s -= 80; });
  if (cfg.siblingRule === "together") sibs.forEach((sib) => { if (ids.includes(sib)) s += 40; });
  if (cfg.prevClassSeparate && st.prevClass) {
    s -= clStudents.filter((x) => x.prevClass && x.prevClass === st.prevClass).length * 8;
  }
  s -= Math.abs(clStudents.length - total / nCls) * 2;
  return s;
}

function distribute(students, numCls, cfg) {
  try {
    const cls = Array.from({ length: numCls }, (_, i) => ({ id: i + 1, students: [] }));
    const asgn = {};

    // Step 1: Fixierte Schüler zuerst platzieren
    students.forEach((s) => {
      if (s.lockedClass && s.lockedClass >= 1 && s.lockedClass <= numCls) {
        cls[s.lockedClass - 1].students.push(s);
        asgn[s.id] = s.lockedClass;
      }
    });

    // Step 2: Greedy-Zuweisung für den Rest
    const remaining = students.filter((s) => !asgn[s.id]);
    const tgt = Math.ceil(students.length / numCls);
    const shuf = [...remaining].sort(() => Math.random() - 0.5);
    for (const st of shuf) {
      let best = null, bs = -Infinity;
      for (const cl of cls) {
        if (cl.students.length >= tgt + 1) continue;
        const v = calcScore(st, cl.students, cfg, students.length, numCls);
        if (v > bs) { bs = v; best = cl; }
      }
      if (best) { best.students.push(st); asgn[st.id] = best.id; }
    }

    // Step 3: Fallback — falls Kapazität zu knapp, nicht zugewiesene Schüler in kleinste Klasse
    students.forEach((s) => {
      if (!asgn[s.id]) {
        const smallest = cls.reduce((a, b) => a.students.length <= b.students.length ? a : b);
        smallest.students.push(s);
        asgn[s.id] = smallest.id;
      }
    });

    // Step 4: Swap-Phase (fixierte Schüler bleiben fix)
    const movable = new Set(students.filter((s) => !s.lockedClass).map((s) => s.id));
    for (let iter = 0; iter < 100; iter++) {
      let imp = false;
      for (let ai = 0; ai < students.length; ai++) {
        for (let bi = ai + 1; bi < students.length; bi++) {
          const s1 = students[ai], s2 = students[bi];
          if (!movable.has(s1.id) || !movable.has(s2.id)) continue;
          const c1 = asgn[s1.id], c2 = asgn[s2.id];
          if (!c1 || !c2 || c1 === c2) continue;
          const cl1 = cls[c1 - 1], cl2 = cls[c2 - 1];
          if (!cl1 || !cl2) continue;
          const old = calcScore(s1, cl1.students, cfg, students.length, numCls)
                    + calcScore(s2, cl2.students, cfg, students.length, numCls);
          cl1.students = cl1.students.filter((s) => s.id !== s1.id);
          cl2.students = cl2.students.filter((s) => s.id !== s2.id);
          cl1.students.push(s2);
          cl2.students.push(s1);
          const nw = calcScore(s2, cl1.students, cfg, students.length, numCls)
                   + calcScore(s1, cl2.students, cfg, students.length, numCls);
          let ngV = false;
          s1.noGo.forEach((ng) => { if (cl2.students.some((s) => s.id === ng)) ngV = true; });
          s2.noGo.forEach((ng) => { if (cl1.students.some((s) => s.id === ng)) ngV = true; });
          if (nw > old && !ngV) {
            asgn[s1.id] = c2;
            asgn[s2.id] = c1;
            imp = true;
          } else {
            cl1.students = cl1.students.filter((s) => s.id !== s2.id);
            cl2.students = cl2.students.filter((s) => s.id !== s1.id);
            cl1.students.push(s1);
            cl2.students.push(s2);
          }
        }
      }
      if (!imp) break;
    }
    return cls;
  } catch (e) {
    console.error(e);
    // Allerletzter Fallback: simple Rundumverteilung
    const fb = Array.from({ length: numCls }, (_, i) => ({ id: i + 1, students: [] }));
    students.forEach((s, i) => fb[i % numCls].students.push(s));
    return fb;
  }
}

function scoreResult(classes) {
  let wM = 0, wT = 0, ngV = 0, gD = 0;
  classes.forEach((c) => {
    const ids = c.students.map((s) => s.id);
    c.students.forEach((s) => {
      wT += s.wishes.length;
      s.wishes.forEach((w) => { if (ids.includes(w)) wM++; });
      s.noGo.forEach((n) => { if (ids.includes(n)) ngV++; });
    });
    gD += Math.abs(
      c.students.filter((s) => s.gender === "m").length
      - c.students.filter((s) => s.gender === "w").length
    );
  });
  return { wishesMet: wM, wishesTotal: wT, noGoV: ngV, genderDiff: gD, score: wM * 10 - ngV * 50 - gD * 2 };
}

function calcStats(classes) {
  return classes.map((c) => {
    const ids = c.students.map((s) => s.id);
    let wM = 0, wT = 0;
    c.students.forEach((s) => {
      wT += s.wishes.length;
      s.wishes.forEach((w) => { if (ids.includes(w)) wM++; });
    });
    let ngViol = 0;
    c.students.forEach((s) => s.noGo.forEach((n) => { if (ids.includes(n)) ngViol++; }));
    return {
      id: c.id,
      total: c.students.length,
      boys: c.students.filter((s) => s.gender === "m").length,
      girls: c.students.filter((s) => s.gender === "w").length,
      notes: c.students.filter((s) => s.note).length,
      wishesMet: wM, wishesTotal: wT, noGoViolations: ngViol
    };
  });
}

function analyzeWishes(result, allStudents) {
  const report = [];
  result.forEach((cls) => {
    const ids = cls.students.map((s) => s.id);
    cls.students.forEach((s) => {
      if (!s.wishes.length) return;
      const met = s.wishes.filter((w) => ids.includes(w));
      const unmet = s.wishes.filter((w) => !ids.includes(w));
      if (unmet.length > 0) {
        const details = unmet.map((wid) => {
          const ws = allStudents.find((x) => x.id === wid);
          const wCls = result.find((c) => c.students.some((x) => x.id === wid));
          return { student: ws, inClass: wCls ? wCls.id : "?" };
        });
        report.push({ student: s, classId: cls.id, met, unmet, details, ratio: met.length / s.wishes.length });
      }
    });
  });
  report.sort((a, b) => a.ratio - b.ratio);
  return report;
}

function exportResultCSV(result, allStudents) {
  if (!result) return;
  const rows = [["Name", "Geschlecht", "Klasse", "Wunsche_erfuellt", "Wunsche_gesamt", "NoGo_Konflikte", "Geschwister_zusammen", "Vorjahresklasse", "Notiz", "Fixiert"]];
  result.forEach((cls) => {
    const ids = cls.students.map((s) => s.id);
    cls.students.slice().sort((a, b) => a.name.localeCompare(b.name)).forEach((s) => {
      const wMet = s.wishes.filter((w) => ids.includes(w)).length;
      const ngH = s.noGo.filter((n) => ids.includes(n)).length;
      const sibT = (s.siblings || []).filter((sib) => ids.includes(sib)).length;
      rows.push([
        s.name,
        s.gender === "m" ? "Junge" : "Mädchen",
        "Klasse " + cls.id,
        wMet, s.wishes.length,
        ngH,
        sibT,
        s.prevClass || "",
        s.note || "",
        s.lockedClass ? "ja" : "nein"
      ]);
    });
  });
  const csv = "\uFEFF" + rows.map((r) =>
    r.map((c) => `"${String(c).replace(/"/g, '""')}"`).join(";")
  ).join("\r\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "klassenverteilung_" + new Date().toISOString().slice(0, 10) + ".csv";
  a.click();
  URL.revokeObjectURL(url);
}

  const saveEdit = () => {
    setStudents((p) => p.map((s) => s.id === editId ? { ...s, wishes: editWishes, noGo: editNoGo } : s));
    setEditId(null);
  };
  const toggleWish = (tid) => {
    setEditWishes((p) => p.includes(tid) ? p.filter((w) => w !== tid) : (p.length < config.maxWishes ? [...p, tid] : p));
    setEditNoGo((p) => p.filter((n) => n !== tid));
  };
  const toggleNoGo = (tid) => {
    setEditNoGo((p) => p.includes(tid) ? p.filter((n) => n !== tid) : [...p, tid]);
    setEditWishes((p) => p.filter((w) => w !== tid));
  };
  const toggleSibling = (sid, tid) => {
    setStudents((p) => p.map((s) => {
      if (s.id === sid) {
        const sibs = s.siblings || [];
        return { ...s, siblings: sibs.includes(tid) ? sibs.filter((x) => x !== tid) : [...sibs, tid] };
      }
      if (s.id === tid) {
        const sibs = s.siblings || [];
        return { ...s, siblings: sibs.includes(sid) ? sibs.filter((x) => x !== sid) : [...sibs, sid] };
      }
      return s;
    }));
  };

  const handleCSV = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const raw = String(ev.target.result || "").replace(/^\uFEFF/, "");
      const lines = raw.split(/\r?\n/).filter((l) => l.trim());
      if (lines.length < 2) { alert("CSV braucht Kopfzeile + Daten."); return; }
      const delim = lines[0].includes(";") ? ";" : (lines[0].includes("\t") ? "\t" : ",");
      const h = lines[0].toLowerCase().split(delim).map((x) => x.trim().replace(/^"|"$/g, ""));
      const ni = h.findIndex((x) => x.includes("name"));
      const gi = h.findIndex((x) => x.includes("geschlecht") || x.includes("gender"));
      const noi = h.findIndex((x) => x.includes("notiz") || x.includes("bemerkung"));
      const pi = h.findIndex((x) => x.includes("klasse") || x.includes("vorjahr"));
      if (ni === -1) { alert("Spalte 'Name' nicht gefunden."); return; }
      const ns = [];
      let id = 1;
      for (let i = 1; i < lines.length; i++) {
        const cols = lines[i].split(delim).map((x) => x.trim().replace(/^"|"$/g, ""));
        const name = cols[ni];
        if (!name) continue;
        const gr = gi >= 0 ? (cols[gi] || "").toLowerCase() : "";
        ns.push(normalizeStudent({
          id, name,
          gender: gr.startsWith("w") || gr.startsWith("f") ? "w" : "m",
          wishes: [], noGo: [],
          note: noi >= 0 ? (cols[noi] || "") : "",
          code: genCode(name, id),
          siblings: [],
          prevClass: pi >= 0 ? (cols[pi] || "") : "",
          lockedClass: null
        }));
        id++;
      }
      if (ns.length > 0) {
        setStudents(ns);
        setResult(null);
        setMoveHistory([]);
        alert("✅ " + ns.length + " Schüler importiert!");
      }
    };
    reader.readAsText(file, "UTF-8");
    e.target.value = "";
  };

  const saveProject = () => {
    const d = JSON.stringify({ students, numClasses, config, comments, changeLog, result }, null, 2);
    const b = new Blob([d], { type: "application/json" });
    const u = URL.createObjectURL(b);
    const a = document.createElement("a");
    a.href = u;
    a.download = "klassenverteilung_" + new Date().toISOString().slice(0, 10) + ".json";
    a.click();
    URL.revokeObjectURL(u);
  };

  const loadProject = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const d = JSON.parse(ev.target.result);
        if (d.students) {
          setStudents(d.students.map(normalizeStudent));
          if (d.numClasses) setNumClasses(d.numClasses);
          if (d.config) setConfig((p) => ({ ...p, ...d.config }));
          if (d.comments) setComments(d.comments);
          if (d.changeLog) setChangeLog(d.changeLog);
          if (d.result) setResult(d.result.map((c) => ({ ...c, students: c.students.map(normalizeStudent) })));
          else setResult(null);
          setMoveHistory([]);
          alert("✅ Projekt geladen!");
        }
      } catch (err) {
        alert("Fehler beim Laden: " + err.message);
      }
    };
    reader.readAsText(file, "UTF-8");
    e.target.value = "";
  };

  const loadDemo = () => {
    if (students.length > 0 && !confirm("Aktuelle Daten durch Demo ersetzen?")) return;
    setStudents(DEMO.map(normalizeStudent));
    setResult(null); setMoveHistory([]); setComments({}); setChangeLog([]);
    alert("✅ Demo geladen.");
  };
  const clearAll = () => {
    if (!confirm("Wirklich ALLE Schüler und Daten löschen?")) return;
    setStudents([]); setResult(null); setMoveHistory([]); setComments({}); setChangeLog([]);
  };

  const runDistribution = () => {
    if (students.length < numClasses) {
      alert("Zu wenige Schüler für " + numClasses + " Klassen.");
      return;
    }
    setDistributing(true);
    setTimeout(() => {
      try {
        let best = null, bs = -Infinity;
        for (let i = 0; i < 15; i++) {
          const r = distribute(students, numClasses, config);
          const s = scoreResult(r);
          if (s.score > bs) { bs = s.score; best = r; }
        }
        setResult(best);
        setMoveStudent(null);
        setChangeLog([]);
        setMoveHistory([]);
        setScenarios(null);
        setTab("result");
      } catch (e) {
        console.error(e);
        alert("Fehler bei der Verteilung: " + e.message);
      }
      setDistributing(false);
    }, 50);
  };

  const snapshotForUndo = (label) => {
    setMoveHistory((p) => [
      ...p.slice(-19),
      { result: JSON.parse(JSON.stringify(result)), log: [...changeLog], label }
    ]);
  };

  const undoMove = () => {
    if (moveHistory.length === 0) return;
    const last = moveHistory[moveHistory.length - 1];
    setResult(last.result);
    setChangeLog(last.log);
    setMoveHistory((p) => p.slice(0, -1));
    setMoveStudent(null);
  };

  const doMove = (tid) => {
    if (!moveStudent || !result) return;
    const { studentId, fromClassId } = moveStudent;
    if (fromClassId === tid) return setMoveStudent(null);
    const student = result.find((c) => c.id === fromClassId)?.students.find((s) => s.id === studentId);
    if (!student) return;
    snapshotForUndo("move " + student.name);
    setResult(result.map((c) => {
      if (c.id === fromClassId) return { ...c, students: c.students.filter((s) => s.id !== studentId) };
      if (c.id === tid) return { ...c, students: [...c.students, student] };
      return c;
    }));
    setChangeLog((p) => [
      { text: `${student.name}: Kl.${fromClassId} → Kl.${tid}`, time: new Date().toLocaleTimeString("de") },
      ...p
    ]);
    setMoveStudent(null);
  };

  const toggleLock = (studentId, classId) => {
    const s = students.find((x) => x.id === studentId);
    if (!s) return;
    const newLocked = s.lockedClass === classId ? null : classId;
    setStudents((p) => p.map((x) => x.id === studentId ? { ...x, lockedClass: newLocked } : x));
    // Ergebnis-Kopie ebenso aktualisieren
    if (result) {
      setResult(result.map((c) => ({
        ...c,
        students: c.students.map((x) => x.id === studentId ? { ...x, lockedClass: newLocked } : x)
      })));
    }
  };

  const unlockAll = () => {
    setStudents((p) => p.map((s) => ({ ...s, lockedClass: null })));
    if (result) {
      setResult(result.map((c) => ({ ...c, students: c.students.map((s) => ({ ...s, lockedClass: null })) })));
    }
  };

  const runScenarios = () => {
    const cfgs = [
      { ...config, wishWeight: 5, label: "🔴 Wünsche priorisiert" },
      { ...config, wishWeight: 3, label: "🟡 Ausgewogen" },
      { ...config, wishWeight: 0, label: "🟢 Balance priorisiert" }
    ];
    setScenarios(cfgs.map((cf) => {
      let best = null, bs = -Infinity;
      for (let i = 0; i < 15; i++) {
        const r = distribute(students, numClasses, cf);
        const s = scoreResult(r);
        if (s.score > bs) { bs = s.score; best = r; }
      }
      return { config: cf, result: best, score: scoreResult(best) };
    }));
  };

  const handleQRScan = (data) => {
    try {
      const p = JSON.parse(data);
      if (p.sid) {
        const s = students.find((x) => x.id === p.sid);
        if (s) { setCaptureStudentId(s.id); setCaptureMode("entry"); return; }
      }
    } catch (e) {}
    handleCodeLookup(data);
  };

  const handleCodeLookup = (code) => {
    const s = students.find((x) => x.code === code.trim().toUpperCase());
    if (s) { setCaptureStudentId(s.id); setCaptureMode("entry"); setCodeInput(""); }
    else {
      setCaptureSuccess(`❌ "${code}" nicht gefunden.`);
      setTimeout(() => setCaptureSuccess(null), 2500);
    }
  };

  const saveCaptureWishes = () => {
    const name = students.find((s) => s.id === captureStudentId)?.name;
    setStudents((p) => p.map((s) => s.id === captureStudentId ? { ...s, wishes: capWishes, noGo: capNoGo } : s));
    setCaptureSuccess(`✅ ${name}: gespeichert!`);
    setCaptureStudentId(null);
    setCaptureMode(null);
    setTimeout(() => setCaptureSuccess(null), 3000);
  };

  const stats = result ? calcStats(result) : [];
  const sc = result ? scoreResult(result) : null;
  const wishReport = result ? analyzeWishes(result, students) : [];
  const wishesEntered = students.filter((s) => s.wishes.length > 0).length;
  const lockedCount = students.filter((s) => s.lockedClass).length;

  // ============ RENDER ============
  return h("div", { style: { fontFamily: ff, background: C.bg, minHeight: "100vh", color: C.text, maxWidth: 540, margin: "0 auto", padding: "0 10px 60px" } },
    h("input", { ref: fileRef, type: "file", accept: ".csv,.txt", onChange: handleCSV, style: { display: "none" } }),
    h("input", { ref: loadRef, type: "file", accept: ".json", onChange: loadProject, style: { display: "none" } }),

    // Header
    h("div", { className: "noprint", style: { textAlign: "center", padding: "22px 0 12px", borderBottom: "2px solid " + C.primary, marginBottom: 12 } },
      h("div", { style: { fontSize: 28 } }, "🏫"),
      h("h1", { style: { fontSize: 18, fontWeight: 800, color: C.primary } }, "Klassenverteilung"),
      h("p", { style: { fontSize: 11, color: C.textLight, marginTop: 3 } },
        students.length, " Schüler · ", wishesEntered, " Wünsche · ", numClasses, " Klassen",
        lockedCount > 0 && ` · 📌 ${lockedCount}`
      ),
      h("div", { style: { display: "flex", gap: 4, justifyContent: "center", marginTop: 8, flexWrap: "wrap" } },
        h(Btn, { onClick: saveProject, v: "ghost", small: true }, "💾 Speichern"),
        h(Btn, { onClick: () => loadRef.current?.click(), v: "ghost", small: true }, "📂 Laden"),
        h(Btn, { onClick: () => fileRef.current?.click(), v: "ghost", small: true }, "📥 CSV")
      )
    ),

    // Tabs
    h("div", { className: "noprint", style: { display: "flex", gap: 2, marginBottom: 12, background: C.card, borderRadius: 10, padding: 3, boxShadow: C.shadow, overflowX: "auto" } },
      TABS.map((t) => h("button", {
        key: t.id,
        onClick: () => setTab(t.id),
        style: {
          flex: "1 0 auto", padding: "8px 6px", borderRadius: 8, border: "none",
          background: tab === t.id ? C.primary : "transparent",
          color: tab === t.id ? "#fff" : C.textLight,
          fontFamily: ff, fontSize: 11, fontWeight: 600, cursor: "pointer", whiteSpace: "nowrap"
        }
      }, t.icon, " ", t.label))
    ),

    // ============ STUDENTS TAB ============
    tab === "students" && h("div", null,
      h(Card, null,
        h("div", { style: { fontSize: 13, fontWeight: 700, marginBottom: 8, color: C.primary } }, "+ Neuer Schüler"),
        h("div", { style: { display: "flex", gap: 6, flexWrap: "wrap" } },
          h(Inp, { value: newName, onChange: setNewName, placeholder: "Name", style: { flex: "2 1 130px" } }),
          h("select", {
            value: newGender, onChange: (e) => setNewGender(e.target.value),
            style: { padding: "9px 8px", borderRadius: 8, border: "1px solid " + C.border, fontFamily: ff, fontSize: 13, flex: "0 0 85px" }
          },
            h("option", { value: "m" }, "♂ Junge"),
            h("option", { value: "w" }, "♀ Mädchen")
          ),
          h(Inp, { value: newNote, onChange: setNewNote, placeholder: "Notiz", style: { flex: "1 1 90px" } }),
          h(Btn, { onClick: addStudent, disabled: !newName.trim(), small: true }, "+")
        )
      ),
      h(Card, null,
        h("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 } },
          h("span", { style: { fontSize: 12, fontWeight: 700, color: C.primary } }, "📥 CSV-Import"),
          h("button", {
            onClick: () => setShowCsvHelp(!showCsvHelp),
            style: { fontSize: 11, color: C.accent, background: "none", border: "none", cursor: "pointer", fontWeight: 600 }
          }, showCsvHelp ? "×" : "Format?")
        ),
        showCsvHelp && h("div", {
          style: { fontSize: 11, color: C.textMid, lineHeight: 1.6, marginBottom: 8, padding: "8px 10px", background: C.accentLight, borderRadius: 8 }
        },
          "Spalten: ", h("b", null, "Name"), " (Pflicht), ",
          h("b", null, "Geschlecht"), " (m/w), ",
          h("b", null, "Notiz"), ", ",
          h("b", null, "Vorjahresklasse"),
          h("br", null),
          "Trenner: ; , oder TAB. BOM & UTF-8 werden erkannt."
        ),
        h(Btn, { onClick: () => fileRef.current?.click(), v: "accent", small: true, style: { width: "100%" } }, "📂 CSV-Datei wählen")
      ),
      students.map((s) => {
        const isEd = editId === s.id;
        return h("div", {
          key: s.id,
          style: {
            background: C.card, borderRadius: 10, padding: "9px 11px", marginBottom: 4,
            boxShadow: C.shadow, border: isEd ? "2px solid " + C.accent : "1px solid " + C.border
          }
        },
          h("div", { style: { display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" } },
            h(Badge, { bg: s.gender === "m" ? C.boyBg : C.girlBg, color: s.gender === "m" ? C.boyTxt : C.girlTxt }, s.gender === "m" ? "♂" : "♀"),
            h("span", { style: { fontWeight: 600, fontSize: 13, flex: 1 } }, s.name),
            s.lockedClass && h(Badge, { bg: C.lockBg, color: C.lockTxt, style: { fontSize: 9 } }, "📌Kl.", s.lockedClass),
            s.prevClass && h(Badge, { bg: "#F3F4F6", color: "#6B7280", style: { fontSize: 9 } }, "Vj:", s.prevClass),
            (s.siblings || []).length > 0 && h(Badge, { bg: C.moveBg, color: C.moveTxt, style: { fontSize: 9 } }, "👫"),
            s.note && h(Badge, { bg: C.accentLight, color: C.accent }, s.note),
            s.wishes.length > 0 && h("span", { style: { fontSize: 11, color: C.success } }, "💚", s.wishes.length),
            h("button", {
              onClick: () => isEd ? saveEdit() : startEdit(s),
              style: { background: isEd ? C.accent : C.primaryLight, color: isEd ? "#fff" : C.primary, border: "none", borderRadius: 6, padding: "4px 8px", fontSize: 11, fontWeight: 600, cursor: "pointer" }
            }, isEd ? "✓" : "✏️"),
            h("button", {
              onClick: () => removeStudent(s.id),
              style: { background: C.dangerLight, color: C.danger, border: "none", borderRadius: 6, padding: "4px 7px", fontSize: 11, cursor: "pointer" }
            }, "✕")
          ),
          isEd && h("div", { style: { marginTop: 9, paddingTop: 9, borderTop: "1px dashed " + C.border } },
            h("div", { style: { fontSize: 11, fontWeight: 600, color: C.textMid, marginBottom: 5 } }, "💚 Wunsch · 🚫 NoGo · 👫 Geschwister"),
            h("div", { style: { display: "flex", flexWrap: "wrap", gap: 3 } },
              students.filter((o) => o.id !== s.id).map((o) => {
                const isW = editWishes.includes(o.id);
                const isN = editNoGo.includes(o.id);
                const isSib = (s.siblings || []).includes(o.id);
                return h("div", {
                  key: o.id,
                  style: {
                    display: "flex", alignItems: "center", gap: 2,
                    background: isW ? "#D5F5E3" : isN ? "#FADBD8" : isSib ? C.moveBg : "#F4F3EF",
                    borderRadius: 6, padding: "3px 4px", fontSize: 11
                  }
                },
                  h("span", null, o.name.split(" ")[0]),
                  h("button", {
                    onClick: () => toggleWish(o.id),
                    style: { background: isW ? C.primary : "#ddd", color: "#fff", border: "none", borderRadius: 3, width: 20, height: 20, fontSize: 10, cursor: "pointer" }
                  }, "💚"),
                  h("button", {
                    onClick: () => toggleNoGo(o.id),
                    style: { background: isN ? C.danger : "#ddd", color: "#fff", border: "none", borderRadius: 3, width: 20, height: 20, fontSize: 10, cursor: "pointer" }
                  }, "🚫"),
                  h("button", {
                    onClick: () => toggleSibling(s.id, o.id),
                    style: { background: isSib ? C.moveTxt : "#ddd", color: "#fff", border: "none", borderRadius: 3, width: 20, height: 20, fontSize: 10, cursor: "pointer" }
                  }, "👫")
                );
              })
            ),
            h("div", { style: { marginTop: 6 } },
              h("label", { style: { fontSize: 11, color: C.textMid } }, "Vorjahresklasse: "),
              h("input", {
                value: s.prevClass || "",
                onChange: (e) => setStudents((p) => p.map((x) => x.id === s.id ? { ...x, prevClass: e.target.value } : x)),
                placeholder: "z.B. A",
                style: { padding: "4px 8px", borderRadius: 6, border: "1px solid " + C.border, fontFamily: ff, fontSize: 12, width: 60 }
              })
            )
          )
        );
      })
    ),

    // ============ FORMS TAB ============
    tab === "forms" && h("div", null,
      h(Card, { className: "noprint" },
        h("h3", { style: { fontSize: 14, fontWeight: 700, color: C.primary, margin: "0 0 6px" } }, "📋 Eltern-Formulare"),
        h("p", { style: { fontSize: 12, color: C.textMid, margin: "0 0 10px" } }, "Drucken → Eltern ausfüllen → Erfassung eintragen."),
        h(Btn, { onClick: () => window.print(), v: "accent", small: true }, "🖨️ Drucken")
      ),
      students.map((s) => h(Card, { key: s.id, style: { pageBreakInside: "avoid" } },
        h("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 10 } },
          h("div", { style: { flex: 1 } },
            h("div", { style: { fontSize: 9, color: C.textLight, textTransform: "uppercase", letterSpacing: 1 } }, "Wunschzettel"),
            h("div", { style: { fontSize: 15, fontWeight: 800, color: C.primary } }, s.name),
            h(Badge, { bg: C.bg, color: C.textMid, style: { fontFamily: "monospace", fontSize: 11, marginTop: 2 } }, "Code: ", s.code)
          ),
          h(QRDisplay, { data: JSON.stringify({ sid: s.id, code: s.code }), size: 70 })
        ),
        h("div", { style: { marginTop: 10, padding: "8px 10px", background: C.primaryLight, borderRadius: 8 } },
          h("div", { style: { fontSize: 11, fontWeight: 700, color: C.primary, marginBottom: 6 } }, "Wunschkinder (max. ", config.maxWishes, "):"),
          h("div", { style: { display: "flex", flexWrap: "wrap", gap: 3 } },
            students.filter((o) => o.id !== s.id).map((o) =>
              h("span", {
                key: o.id,
                style: { padding: "3px 7px", borderRadius: 5, background: "#fff", fontSize: 10, border: "1px solid " + C.border }
              }, "☐ ", o.name)
            )
          )
        ),
        h("div", { style: { marginTop: 6, padding: "8px 10px", background: C.dangerLight, borderRadius: 8 } },
          h("div", { style: { fontSize: 11, fontWeight: 700, color: C.danger, marginBottom: 3 } }, "NoGo (optional):"),
          h("div", { style: { borderBottom: "1px solid " + C.border, height: 20 } })
        ),
        h("div", { style: { marginTop: 6, fontSize: 8, color: C.textLight, lineHeight: 1.4 } },
          "🔒 Lokale Verarbeitung, Löschung nach Abschluss. Art. 6 Abs. 1 lit. e DSGVO."
        )
      ))
    ),

    // ============ CAPTURE TAB ============
    tab === "capture" && h("div", null,
      captureSuccess && h(Card, { style: { background: captureSuccess.startsWith("✅") ? C.successLight : C.dangerLight, border: "none" } },
        h("div", { style: { fontSize: 13, fontWeight: 600, textAlign: "center" } }, captureSuccess)
      ),
      captureMode === "entry" && captureStudentId && (() => {
        const s = students.find((st) => st.id === captureStudentId);
        if (!s) return null;
        return h(Card, null,
          h("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 } },
            h("div", { style: { fontSize: 14, fontWeight: 700, color: C.primary } }, s.name),
            h(Btn, { onClick: () => { setCaptureMode(null); setCaptureStudentId(null); }, v: "ghost", small: true }, "✕")
          ),
          h("div", { style: { display: "flex", flexWrap: "wrap", gap: 4 } },
            students.filter((o) => o.id !== s.id).map((o) => {
              const isW = capWishes.includes(o.id);
              const isN = capNoGo.includes(o.id);
              return h("div", {
                key: o.id,
                style: {
                  display: "flex", alignItems: "center", gap: 3,
                  background: isW ? "#D5F5E3" : isN ? "#FADBD8" : "#F0EFEA",
                  borderRadius: 7, padding: "5px 7px", fontSize: 12
                }
              },
                h("span", { style: { fontWeight: 500 } }, o.name),
                h("button", {
                  onClick: () => {
                    setCapWishes((p) => p.includes(o.id) ? p.filter((w) => w !== o.id) : (p.length < config.maxWishes ? [...p, o.id] : p));
                    setCapNoGo((p) => p.filter((n) => n !== o.id));
                  },
                  style: { background: isW ? C.primary : "#ccc", color: "#fff", border: "none", borderRadius: 4, width: 24, height: 24, fontSize: 11, cursor: "pointer" }
                }, "💚"),
                h("button", {
                  onClick: () => {
                    setCapNoGo((p) => p.includes(o.id) ? p.filter((n) => n !== o.id) : [...p, o.id]);
                    setCapWishes((p) => p.filter((w) => w !== o.id));
                  },
                  style: { background: isN ? C.danger : "#ccc", color: "#fff", border: "none", borderRadius: 4, width: 24, height: 24, fontSize: 11, cursor: "pointer" }
                }, "🚫")
              );
            })
          ),
          h(Btn, { onClick: saveCaptureWishes, v: "success", style: { width: "100%", marginTop: 10 } },
            "✓ Speichern (", capWishes.length, " Wünsche)"
          )
        );
      })(),

                onClick: runDistribution, v: "accent", disabled: distributing,
                style: { flex: 1, padding: 14, fontSize: 14, borderRadius: 12 }
              }, distributing ? "⏳" : "🔄 Neu berechnen"),
              h(Btn, {
                onClick: () => exportResultCSV(result, students), v: "ghost",
                style: { padding: 14, borderRadius: 12 }, title: "Klassenliste als CSV exportieren"
              }, "📤 CSV"),
              h(Btn, {
                onClick: () => window.print(), v: "ghost",
                style: { padding: 14, borderRadius: 12 }
              }, "🖨️")
            )
          )
    )
  );
}

window.__App = App;
ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(window.__App));
</script>
</body>
</html>
